<!DOCTYPE html>
<html lang="en-GB"><head>
<title>CRATER Risk Management Workbench</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: step rail on the left (top strip on phones), KPI band, one working view per process step */
:root {
  --bg: #F2F3F7; --surface: #FFFFFF; --sunk: #F7F8FB; --ink: #161A2C; --muted: #5A6177; --line: #DCDFE8;
  --accent: #2E47C6; --accent-ink: #FFFFFF; --accent-soft: #E7EBFB;
  --crit: #B8232F; --crit-bg: #FBE3E5; --high: #B9560F; --high-bg: #FCEADB; --lim: #8A6A00; --lim-bg: #FAF0CC; --low: #23794F; --low-bg: #DFF2E7;
  --mark: #2E47C6;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1120; --surface: #161A2B; --sunk: #12162504; --ink: #E6E8F2; --muted: #98A0B8; --line: #2A3048;
  --accent: #8C9EFF; --accent-ink: #0E1120; --accent-soft: #222A50;
  --crit: #FF7C86; --crit-bg: #3B1A22; --high: #FFA45E; --high-bg: #3A2616; --lim: #E9C74E; --lim-bg: #33290F; --low: #5FD39A; --low-bg: #12301F;
  --mark: #8C9EFF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1120; --surface: #161A2B; --sunk: #12162504; --ink: #E6E8F2; --muted: #98A0B8; --line: #2A3048;
  --accent: #8C9EFF; --accent-ink: #0E1120; --accent-soft: #222A50;
  --crit: #FF7C86; --crit-bg: #3B1A22; --high: #FFA45E; --high-bg: #3A2616; --lim: #E9C74E; --lim-bg: #33290F; --low: #5FD39A; --low-bg: #12301F;
  --mark: #8C9EFF; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
.id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.eyebrow { font-family: var(--f-display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 68ch; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.over > i { background: var(--crit); }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
nav.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
nav.steps .grp { margin: 14px 0 4px 10px; }
nav.steps .grp:first-child { margin-top: 0; }
nav.steps button { all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--ink); font-weight: 500; }
nav.steps button .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 14px; }
nav.steps button:hover { background: var(--accent-soft); }
nav.steps button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.steps button[aria-current="page"] .n { color: var(--accent-ink); opacity: .75; }
nav.steps button:focus-visible, .btn:focus-visible, .chip:focus-visible, tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main.view { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; }
.vhead p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel.pad { padding: 16px; }
.scroll { overflow-x: auto; }

table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.sec td { background: var(--accent-soft); font-family: var(--f-display); font-weight: 600; font-size: 13px; padding-block: 6px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
tr.detail td { background: var(--bg); }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
td.desc { color: var(--muted); min-width: 260px; max-width: 520px; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-Critical, .p-H { color: var(--crit); background: var(--crit-bg); }
.b-High { color: var(--high); background: var(--high-bg); }
.b-Limited, .p-M { color: var(--lim); background: var(--lim-bg); }
.b-Low, .p-L { color: var(--low); background: var(--low-bg); }
.strat-Mitigate { color: var(--accent); background: var(--accent-soft); }
.strat-Accept { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.chip .id { font-size: 11px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.on .id { color: var(--accent-ink); opacity: .8; }
.chip.static { cursor: default; }
.chip.static:hover { border-color: var(--line); }

.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.small { padding: 3px 9px; font-size: 12px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="number"] { width: 76px; font-variant-numeric: tabular-nums; text-align: right; }
input.wide, select.wide { width: 100%; min-width: 180px; }
textarea { width: 100%; min-width: 220px; resize: vertical; min-height: 56px; }
select.use { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 99px; }
select.use-yes { color: var(--low); background: var(--low-bg); border-color: transparent; }
select.use-no { color: var(--muted); background: var(--bg); }
select.use-unset { color: var(--lim); border-style: dashed; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type="search"] { min-width: 0; width: 280px; max-width: 100%; }
label.inline { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 500; max-width: 100%; min-width: 0; }
.toolbar select { max-width: 100%; min-width: 0; }

.note { font-size: 13px; color: var(--muted); padding: 10px 14px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 0 8px 8px 0; }
.note.ok { border-left-color: var(--low); }
.note.warn { border-left-color: var(--crit); color: var(--ink); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: baseline; }
.legend .pill { flex: none; }

/* risk assessment */
.assess { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.heat { display: grid; grid-template-columns: 26px repeat(5, minmax(0, 1fr)); gap: 3px; font-size: 11px; }
.heat .c { aspect-ratio: 1.25; max-width: 100%; border-radius: 4px; padding: 3px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px; }
.heat .ax { display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--f-mono); }
.heat .tag { font-family: var(--f-mono); font-size: 10px; font-weight: 500; background: var(--surface); color: var(--ink); border-radius: 3px; padding: 0 4px; line-height: 16px; border: 1px solid var(--line); }
.heat-cap { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; padding-left: 29px; }

/* matrices */
table.mx th, table.mx td { padding: 4px 6px; text-align: center; border: 1px solid var(--line); }
table.mx th:first-child, table.mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
table.mx tr.sec td { background: var(--accent-soft); }
table.mx th { font-family: var(--f-mono); font-size: 11px; text-transform: none; letter-spacing: 0; }
table.mx td.dot::after { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mark); }
.key { columns: 2 280px; column-gap: 24px; font-size: 13px; }
.key div { break-inside: avoid; padding: 2px 0; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
textarea.code { font-family: var(--f-mono); font-size: 12px; min-height: 150px; white-space: pre; overflow-x: auto; background: var(--bg); }
.issues { margin: 6px 0 0; padding-left: 18px; }
details summary { cursor: pointer; font-weight: 500; }
.ctrl-desc { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 46ch; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-weight: 500; z-index: 20; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.steps { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.steps .grp { display: none; }
  nav.steps button { white-space: nowrap; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .assess { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, nav.steps button { transition: background .12s, border-color .12s; } }

/* Targeted compatibility additions; the original layout, colours and four workflow steps are retained. */
body { margin:0; }
.heat { grid-template-columns:26px repeat(4,minmax(0,1fr)); }
.b-Minimal { color:var(--low);background:var(--low-bg); }
.b-Notassessed { color:var(--muted);background:var(--bg); }
.small-legend { grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:12px; }
.btn[disabled] { opacity:.5;cursor:not-allowed; }
.more-actions { position:relative; }
.more-actions>summary { list-style:none; }
.more-actions>.panel { position:absolute;z-index:12;right:0;width:280px;display:grid;gap:8px;box-shadow:0 8px 24px #0002; }
.more-actions .btn { white-space:normal; }
.graph-panel>summary { font-family:var(--f-display);font-size:17px; }
.graph-panel>.scroll { margin:14px 0; }
.game-results { display:grid;gap:10px; }
.game-results p { margin:5px 0; }
#graph-json { min-height:300px; }
tr.sec td { white-space:normal; }
#view select { max-width:100%; }
#view input.wide { margin-top:5px; }
input[disabled] { opacity:.5; }
.confirm { flex-wrap:wrap;max-width:600px; }
.confirm .muted { flex-basis:100%; }
.panel.pad p { overflow-wrap:anywhere; }
.top-actions { align-items:center; }
@media(max-width:600px){ .wrap{padding-top:14px}.top-actions{width:100%}.top-actions .btn{padding:7px 9px;font-size:12px}.more-actions>.panel{right:0}.kpi{padding:11px}.kpi .v{font-size:23px}input,select,textarea{font-size:16px}.toolbar label.inline{width:100%}.toolbar label.inline select{min-width:0;max-width:100%;flex:1}.toolbar input[type=number]{max-width:100%}.game-results .toolbar{align-items:flex-start}.graph-panel>summary{font-size:16px} }
@media print{nav.steps,.top-actions,.btn,.toolbar,#graph-json{display:none!important}.app{display:block}.wrap{max-width:none;padding:0}.panel{break-inside:avoid}.scroll{overflow:visible}table{font-size:10px}th,td{padding:5px}body{background:white;color:black}.kpis{grid-template-columns:repeat(4,1fr)} }
</style></head><body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">AI system risk management</div>
      <h1>CRATER Risk Management Workbench</h1>
      <p>Identify, assess, evaluate and treat AI-system risks. <br> Manage assets, threats, controls and security budgets.</p>
    </div>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <section class="kpis" id="kpis" aria-label="Register summary"></section>
  <div class="app">
    <nav class="steps" id="nav" aria-label="Workbench sections"></nav>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
const REFERENCE = {"version":"crater-supplement-v2","assets":[{"id":"A1","name":"Data","desc":"Any form of data used in the lifecycle of AI systems, including their training process, deployment, and retraining","value":"H","exposure":"H"},{"id":"A1.1","name":"Raw data","desc":"Unprocessed data collected from various sources before any cleaning or transformation","value":"H","exposure":"H"},{"id":"A1.2","name":"Public data sets","desc":"Openly available datasets that can be used for training and testing AI models","value":"M","exposure":"M"},{"id":"A1.3","name":"Training data","desc":"Data specifically used to train AI models, helping them learn patterns and make predictions","value":"H","exposure":"H"},{"id":"A1.4","name":"Testing and Validation data","desc":"Data used to evaluate the performance of AI models to ensure accuracy and generalisation","value":"H","exposure":"H"},{"id":"A1.5","name":"Log data","desc":"Records of AI system operations, including errors, predictions, and performance metrics","value":"M","exposure":"M"},{"id":"A1.6","name":"Metadata","desc":"Information describing data attributes, structure, and context, aiding in data management","value":"M","exposure":"M"},{"id":"A2","name":"Models","desc":"AI models and their components that define how data is processed and interpreted","value":"H","exposure":"H"},{"id":"A2.1","name":"Algorithms","desc":"Mathematical rules and logic used to process and analyse data in AI systems","value":"H","exposure":"H"},{"id":"A2.2","name":"Models","desc":"Trained AI structures that make predictions or decisions based on input data","value":"H","exposure":"H"},{"id":"A2.3","name":"Model parameters","desc":"Learnt numerical values within an AI model that influence its predictions","value":"H","exposure":"H"},{"id":"A2.4","name":"Hyperparameters","desc":"Configurable settings that control the training process and affect model performance","value":"M","exposure":"M"},{"id":"A2.5","name":"Pre-trained models","desc":"Models that have been trained on large datasets and can be fine-tuned for specific tasks","value":"M","exposure":"M"},{"id":"A2.6","name":"Model architectures","desc":"Structural design of models, such as CNNs for image recognition or Transformers for NLP","value":"M","exposure":"M"},{"id":"A3","name":"Artefacts","desc":"Supporting components and governance structures essential for AI model management","value":"M","exposure":"M"},{"id":"A3.1","name":"Data governance policies","desc":"Guidelines and protocols for managing data quality, security, and compliance","value":"H","exposure":"H"},{"id":"A3.2","name":"Descriptive statistical parameters","desc":"Summary statistics used to analyse data distribution and characteristics","value":"L","exposure":"L"},{"id":"A3.3","name":"Model frameworks","desc":"Predefined libraries and architectures that help develop AI models efficiently","value":"M","exposure":"M"},{"id":"A4","name":"Actors/Stakeholders","desc":"Key individuals or groups involved in the AI development lifecycle","value":"H","exposure":"H"},{"id":"A4.1","name":"Data owners","desc":"Individuals or organisations responsible for data access and management","value":"H","exposure":"H"},{"id":"A4.2","name":"Data scientists","desc":"Professionals who design and implement AI models using statistical and machine-learning techniques","value":"H","exposure":"H"},{"id":"A4.3","name":"Data engineers","desc":"Experts responsible for processing and managing large-scale datasets","value":"H","exposure":"H"},{"id":"A4.4","name":"Model providers","desc":"Organisations or teams that develop and supply AI models for different applications","value":"H","exposure":"H"},{"id":"A4.5","name":"MLOps Engineers","desc":"Professionals who manage AI model deployment, monitoring, and maintenance in production","value":"H","exposure":"H"},{"id":"A4.6","name":"Ethics & Compliance Officers","desc":"Experts ensuring AI models adhere to ethical standards and legal regulations","value":"H","exposure":"H"},{"id":"A5","name":"Processes","desc":"Critical workflows involved in AI system development and maintenance","value":"H","exposure":"H"},{"id":"A5.1","name":"Data ingestion","desc":"The process of collecting and importing data from various sources","value":"H","exposure":"H"},{"id":"A5.2","name":"Data Pre-processing","desc":"Cleaning and transforming raw data into a usable format","value":"H","exposure":"H"},{"id":"A5.3","name":"Data collection","desc":"Gathering data from multiple sources for model training and evaluation","value":"H","exposure":"H"},{"id":"A5.4","name":"Data augmentation","desc":"Techniques used to artificially expand datasets to improve model performance","value":"M","exposure":"M"},{"id":"A5.5","name":"Feature selection","desc":"Identifying relevant variables that contribute to a model's accuracy","value":"M","exposure":"M"},{"id":"A5.6","name":"Training","desc":"The process of teaching an AI model using training datasets","value":"H","exposure":"H"},{"id":"A5.7","name":"Tuning","desc":"Adjusting model parameters and hyperparameters to optimise performance","value":"H","exposure":"H"},{"id":"A5.8","name":"Model monitoring","desc":"Continuous tracking of AI model performance in production to detect drift","value":"H","exposure":"H"},{"id":"A5.9","name":"Model retraining","desc":"Updating models periodically to adapt to new data and maintain accuracy","value":"H","exposure":"H"},{"id":"A6","name":"Environment/Tools","desc":"Software and platforms that support AI model development and deployment","value":"M","exposure":"M"},{"id":"A6.1","name":"Algorithm libraries","desc":"Prebuilt collections of algorithms used for AI and machine learning","value":"M","exposure":"M"},{"id":"A6.2","name":"ML platforms","desc":"Cloud-based or local environments for training and deploying AI models","value":"H","exposure":"H"},{"id":"A6.3","name":"Optimisation techniques","desc":"Methods used to enhance AI model performance and efficiency","value":"M","exposure":"M"},{"id":"A6.4","name":"Integrated development environments","desc":"Software tools that provide a workspace for coding, debugging, and testing AI applications","value":"M","exposure":"M"},{"id":"A6.5","name":"Edge AI devices","desc":"Hardware that enables AI models to run locally on IoT devices or mobile phones","value":"M","exposure":"M"},{"id":"A6.6","name":"Inference engines","desc":"Specialised frameworks for running trained AI models efficiently in production","value":"H","exposure":"H"}],"threats":[{"id":"T1","name":"Data risks","desc":"Threats related to the management and use of data in AI systems."},{"id":"T1.1","name":"Input manipulation","desc":"Altering the input data provided to AI systems to intentionally mislead or skew outputs."},{"id":"T1.2","name":"Introducing malicious samples into training data","desc":"Deliberate insertion of harmful or misleading data into training datasets, resulting in biased or compromised models."},{"id":"T1.3","name":"Data integrity breaches","desc":"Unauthorised modifications to the data, leading to corrupted training or inaccurate model predictions."},{"id":"T1.4","name":"Quality of the database","desc":"Poor quality datasets (e.g., incomplete, noisy, or outdated data) reducing the reliability and robustness of AI models."},{"id":"T1.5","name":"Data drift due to external factors such as reward hacking","desc":"Changes in real-world patterns or behaviours that render the model's learnt rules less effective, causing AI systems to exploit unintended behaviours in their objectives."},{"id":"T1.6","name":"Data drift due to seasonal changes","desc":"Periodic variations in data (e.g., e-commerce patterns) that reduce model accuracy over time."},{"id":"T1.7","name":"Data drift due to changes in processes","desc":"Organisational or operational changes altering the underlying data distribution, making the AI system less accurate."},{"id":"T1.8","name":"Concept drift","desc":"When the relationship between input data and output labels changes over time, degrading the model's predictive power."},{"id":"T1.9","name":"Small dataset size","desc":"Training AI with insufficient data leads to biased, unreliable, or non-generalisable models."},{"id":"T2","name":"Attacks","desc":"Threats arising from malicious attacks on AI systems."},{"id":"T2.1","name":"Adversarial attacks","desc":"Small, imperceptible perturbations to input data that mislead AI systems."},{"id":"T2.2","name":"Poisoning attacks","desc":"Contaminating training data with malicious samples to degrade model performance or achieve specific outcomes."},{"id":"T2.3","name":"Inference attacks","desc":"Extracting sensitive information about the training dataset by observing the AI model's outputs."},{"id":"T2.4","name":"Evasion attacks","desc":"Crafting inputs to avoid detection or bypass security mechanisms in AI-based systems."},{"id":"T2.5","name":"Extraction attacks","desc":"Reverse-engineering AI models to reconstruct sensitive data or proprietary algorithms."},{"id":"T2.6","name":"Membership Inference attacks","desc":"Identifying whether specific data points were part of the training dataset, potentially breaching privacy."},{"id":"T2.7","name":"Physical attacks","desc":"Manipulating the physical environment (e.g., stickers on stop signs) to deceive AI systems."},{"id":"T3","name":"Algorithm risks","desc":"Risks related to AI model algorithms."},{"id":"T3.1","name":"Exploiting Generative AI","desc":"Using generative models to produce harmful outputs, such as deepfakes or malicious content."},{"id":"T3.2","name":"Model theft","desc":"Unauthorised duplication of proprietary AI models, leading to intellectual property loss and competitive disadvantages."},{"id":"T3.3","name":"Zero-day vulnerabilities","desc":"Exploiting unknown or unpatched weaknesses in AI algorithms or their implementations."},{"id":"T4","name":"Operational risks","desc":"Risks from AI system functioning and maintenance."},{"id":"T4.1","name":"Compromise of reliability and safety of an AI system due to complex environments","desc":"Unpredictable interactions with dynamic environments, causing failures."},{"id":"T4.2","name":"Responsiveness of the AI","desc":"Delays in AI system outputs during critical operations, affecting usability or safety."},{"id":"T4.3","name":"Loss of expressiveness of models","desc":"Models becoming overly simplified and unable to capture complex relationships."},{"id":"T4.4","name":"Specific failure cases","desc":"Unexpected failures under edge-case scenarios."},{"id":"T4.5","name":"Non-continuous risk monitoring","desc":"Lack of real-time or ongoing risk evaluation, leading to undetected vulnerabilities or performance degradation."},{"id":"T4.6","name":"Inadequate maintenance","desc":"Lack of updates or adjustments causing models to degrade over time."},{"id":"T4.7","name":"Systems with continuous learning","desc":"AI systems that learn and adapt over time may incorporate unintended biases, security vulnerabilities, or errors due to a lack of oversight."},{"id":"T5","name":"Legal/Privacy/ Ethical risks","desc":"Legal, privacy, and ethical concerns in AI."},{"id":"T5.1","name":"Fairness","desc":"Models that unintentionally or intentionally reinforce biases, leading to unequal treatment or outcomes."},{"id":"T5.2","name":"Privacy","desc":"Compromises of sensitive user data, either during data collection, processing, or sharing."},{"id":"T5.3","name":"Degree of automation and control","desc":"Excessive automation reducing human oversight, leading to unintended consequences or loss of accountability."},{"id":"T5.4","name":"Lack of transparency","desc":"Opaque decision-making processes, making AI actions hard to understand."},{"id":"T5.5","name":"Lack of traceability","desc":"Challenges in tracking data and processes used in training and deploying AI systems."},{"id":"T5.6","name":"Lack of explainability","desc":"Limited ability to explain how or why an AI model arrived at a specific decision."},{"id":"T5.7","name":"Lack of reproducibility","desc":"Difficulty replicating AI results due to inconsistencies in data, algorithms, or environments."},{"id":"T5.8","name":"High degree of transparency","desc":"Over-disclosure of model details or data potentially exposing sensitive or proprietary information."},{"id":"T5.9","name":"Data collection and surveillance","desc":"Excessive or unethical collection of personal data for AI training."},{"id":"T5.10","name":"Data misuse and unauthorised access","desc":"Exploiting or mishandling data, leading to legal and ethical breaches."},{"id":"T5.11","name":"Inference and Re-Identification risks","desc":"Deriving personally identifiable information from supposedly anonymised datasets."},{"id":"T5.12","name":"Bias-Discrimination","desc":"Systematic unfairness due to flawed training data or biased algorithms."},{"id":"T5.13","name":"Lack of informed consent","desc":"Data subjects not being fully aware or agreeing to how their data is collected or used."},{"id":"T5.14","name":"Data sharing and Third-Party risks","desc":"Vulnerabilities introduced through external data sharing or partnerships."},{"id":"T5.15","name":"Deepfakes and synthetic data","desc":"Misuse of AI-generated content to deceive, manipulate, or harm."},{"id":"T5.16","name":"Autonomy and behavioural manipulation","desc":"Exploiting AI systems to unduly influence user behaviour or decision-making."},{"id":"T5.17","name":"Limited information communication to stakeholders","desc":"Inadequate reporting or disclosure of AI risks, limitations, or decisions to business leaders, policymakers, or regulators."},{"id":"T5.18","name":"Limited information communication to end users","desc":"Users are not provided sufficient explanations about how AI decisions are made, leading to trust and usability concerns."},{"id":"T6","name":"Technical risks","desc":"Technical deficiencies and hardware-related issues."},{"id":"T6.1","name":"Technical deficiencies","desc":"General inadequacies in AI models, such as incorrect assumptions, flawed architectures, or suboptimal implementations that reduce system reliability."},{"id":"T6.2","name":"Weaknesses in the system hardware / Hardware faults","desc":"Hardware components may fail, degrade, or be insufficiently robust, affecting AI model performance."},{"id":"T6.3","name":"Hardware failures capable of causing a non-negligible shift in model output","desc":"Failures or faults in computing hardware (e.g., memory, processors) may alter AI computations, leading to noticeable changes in model behaviour or predictions."},{"id":"T6.4","name":"System noise can cause a non-negligible shift in model output","desc":"Variability in system processes may introduce randomness that affects AI model outputs, potentially leading to inconsistent or inaccurate results."},{"id":"T6.5","name":"Random hardware failures","desc":"Unpredictable faults in hardware components (e.g., bit flips, transient errors) that can disrupt AI computations and lead to incorrect or unstable model outputs."},{"id":"T6.6","name":"Common cause failures","desc":"Failures that stem from a single underlying issue and simultaneously affect multiple components of the AI system."},{"id":"T6.7","name":"Systematic failures","desc":"Consistent and repeatable errors in AI systems due to flaws in design, implementation, or training methodologies."},{"id":"T6.8","name":"Time-related program errors (race conditions, deadlocks, heisenbugs)","desc":"Bugs such as race conditions, deadlocks, or heisenbugs that occur due to timing or concurrency issues, potentially causing unpredictable or incorrect AI system behaviour."},{"id":"T6.9","name":"Use of technologies with a lower level of maturity","desc":"Adoption of AI systems that rely on emerging or unproven technologies, leading to unexpected failures or security risks."},{"id":"T7","name":"Human variables","desc":"Risks from human factors in AI systems."},{"id":"T7.1","name":"Absence of a critic","desc":"The lack of human oversight or critique, which could otherwise identify and correct flaws."},{"id":"T7.2","name":"Presence of a critic","desc":"Reliance on human oversight to detect, interpret, and correct errors or misbehaviours in the AI system."},{"id":"T7.3","name":"Reaction times","desc":"Delayed human responses in critical AI failure scenarios."},{"id":"T7.4","name":"Understanding","desc":"Insufficient understanding of AI systems by users or developers leading to misuse or poor decision-making."},{"id":"T7.5","name":"Lack of experience","desc":"Inexperienced personnel causing errors in deploying or managing AI systems."},{"id":"T8","name":"Regulatory risks","desc":"Compliance and regulatory issues."},{"id":"T8.1","name":"Non-compliance with data privacy laws","desc":"Violations of laws such as GDPR, CCPA, or similar regulations."},{"id":"T8.2","name":"Non-compliance with AI-specific regulations such as the AI Act","desc":"Failure to meet legal requirements designed for AI deployment."},{"id":"T8.3","name":"Infringements of Intellectual Property and Copyright","desc":"Use of copyrighted material in training datasets or unauthorised duplication of AI models."},{"id":"T8.4","name":"Ethics and Human Rights violations","desc":"Breaches of ethical standards or human rights protections in AI applications."},{"id":"T8.5","name":"Lack of responsible AI governance","desc":"Inadequate mechanisms for AI oversight, regulation, or accountability."}],"controls":[{"id":"C1","name":"Limit Public Release of Information","desc":"Limit the public release of technical information about the machine learning stack used in an organisation's products or services. Technical knowledge of how machine learning is used can be leveraged by adversaries to perform targeting and tailor attacks to the target system. Additionally, consider limiting the release of organisational information - including physical locations, researcher names, and department structures - from which technical details such as machine learning techniques, model architectures, or datasets may be inferred.","type":"Preventive","assetType":"Data, Environment/Tools","cost":null},{"id":"C2","name":"Limit Model Artefact Release","desc":"Limit public release of technical project details including data, algorithms, model architectures, and model checkpoints that are used in production, or that are representative of those used in production.","type":"Preventive","assetType":"Models, Artefacts","cost":null},{"id":"C3","name":"Passive ML Output Obfuscation","desc":"Decreasing the fidelity of model outputs provided to the end user can reduce an adversaries ability to extract information about the model and optimise attacks for the model.","type":"Preventive","assetType":"Models","cost":null},{"id":"C4","name":"Model Hardening","desc":"Use techniques to make machine learning models robust to adversarial inputs such as adversarial training or network distillation.","type":"Preventive/Corrective","assetType":"Models","cost":null},{"id":"C5","name":"Restrict Number of ML Model Queries","desc":"Limit the total number and rate of queries a user can perform.","type":"Preventive","assetType":"Processes","cost":null},{"id":"C6","name":"Control Access to ML Models and Data at Rest","desc":"Establish access controls on internal model registries and limit internal access to production models. Limit access to training data only to approved users.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C7","name":"Use Ensemble Methods","desc":"Use an ensemble of models for inference to increase robustness to adversarial inputs. Some attacks may effectively evade one model or model family but be ineffective against others.","type":"Preventive","assetType":"Models","cost":null},{"id":"C8","name":"Sanitise Training Data","desc":"Detect and remove or remediate poisoned training data. Training data should be sanitised prior to model training and recurrently for an active learning model. Implement a filter to limit ingested training data. Establish a content policy that would remove unwanted content such as certain explicit or offensive language from being used.","type":"Preventive/Corrective","assetType":"Data","cost":null},{"id":"C9","name":"Validate ML Model","desc":"Validate that machine learning models perform as intended by testing for backdoor triggers or adversarial bias. Monitor model for concept drift and training data drift, which may indicate data tampering and poisoning.","type":"Detective/Corrective","assetType":"Models","cost":null},{"id":"C10","name":"Use Multi-Modal Sensors","desc":"Incorporate multiple sensors to integrate varying perspectives and modalities to avoid a single point of failure susceptible to physical attacks.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C11","name":"Input Restoration","desc":"Preprocess all inference data to nullify or reverse potential adversarial perturbations.","type":"Preventive/Corrective","assetType":"Models, Processes","cost":null},{"id":"C12","name":"Restrict Library Loading","desc":"Prevent abuse of library loading mechanisms in the operating system and software to load untrusted code by configuring appropriate library loading mechanisms and investigating potential vulnerable software. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for loading of malicious libraries.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C13","name":"Encrypt Sensitive Information","desc":"Encrypt sensitive data such as ML models to protect against adversaries attempting to access sensitive data.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C14","name":"Code Signing","desc":"Enforce binary and application integrity with digital signature verification to prevent untrusted code from executing. Adversaries can embed malicious code in ML software or models. Enforcement of code signing can prevent the compromise of the machine learning supply chain and prevent execution of malicious code.","type":"Preventive","assetType":"Artefacts, Environment/Tools","cost":null},{"id":"C15","name":"Verify ML Artefacts","desc":"Verify the cryptographic checksum of all machine learning artefacts to verify that the file was not modified by an attacker.","type":"Preventive","assetType":"Artefacts, Models","cost":null},{"id":"C16","name":"Adversarial Input Detection","desc":"Detect and block adversarial inputs or atypical queries that deviate from known benign behaviour, exhibit behaviour patterns observed in previous attacks or that come from potentially malicious IPs. Incorporate adversarial detection algorithms into the ML system prior to the ML model.","type":"Preventive/Detective","assetType":"Processes, Models","cost":null},{"id":"C17","name":"Vulnerability Scanning","desc":"Vulnerability scanning is used to find potentially exploitable software vulnerabilities to remediate them. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for arbitrary code execution. Both model artefacts and downstream products produced by models should be scanned for known vulnerabilities.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C18","name":"Model Distribution Methods","desc":"Deploying ML models to edge devices can increase the attack surface of the system. Consider serving models in the cloud to reduce the level of access the adversary has to the model. Also consider computing features in the cloud to prevent grey-box attacks, where an adversary has access to the model preprocessing methods.","type":"Preventive/Corrective","assetType":"Models, Environment/Tools","cost":null},{"id":"C19","name":"User Training","desc":"Educate ML model developers on secure coding practices and ML vulnerabilities.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C20","name":"Control Access to ML Models and Data in Production","desc":"Require users to verify their identities before accessing a production model. Require authentication for API endpoints and monitor production model queries to ensure compliance with usage policies and to prevent model misuse.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C21","name":"Generative AI Guardrails","desc":"Guardrails are safety controls that are placed between a generative AI model and the output shared with the user to prevent undesired inputs and outputs. Guardrails can take the form of validators such as filters, rule-based logic, or regular expressions, as well as AI-based approaches, such as classifiers and utilising LLMs, or named entity recognition (NER) to evaluate the safety of the prompt or response. Domain specific methods can be employed to reduce risks in a variety of areas such as etiquette, brand damage, jailbreaking, false information, code exploits, SQL injections, and data leakage.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C22","name":"Generative AI Guidelines","desc":"Guidelines are safety controls that are placed between user-provided input and a generative AI model to help direct the model to produce desired outputs and prevent undesired outputs. Guidelines can be implemented as instructions appended to all user prompts or as part of the instructions in the system prompt. They can define the goal(s), role, and voice of the system, as well as outline safety and security parameters.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C23","name":"Generative AI Model Alignment","desc":"When training or fine-tuning a generative AI model it is important to utilise techniques that improve model alignment with safety, security, and content policies. The fine-tuning process can potentially remove built-in safety mechanisms in a generative AI model, but utilising techniques such as Supervised Fine-Tuning, Reinforcement Learning from Human Feedback or AI Feedback, and Targeted Safety Context Distillation can improve the safety and alignment of the model.","type":"Preventive","assetType":"Models, Processes","cost":null},{"id":"C24","name":"AI Telemetry Logging","desc":"Implement logging of inputs and outputs of deployed AI models. Monitoring logs can help to detect security threats and mitigate impacts.","type":"Preventive/Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C25","name":"Maintain AI Dataset Provenance","desc":"Maintain a detailed history of datasets used for AI applications. The history should include information about the dataset's source as well as a complete record of any modifications.","type":"Preventive","assetType":"Data, Artefacts","cost":null},{"id":"C26","name":"Establish and Maintain an AI Vulnerability Management Process","desc":"Document and update AI-specific vulnerability management processes, including model, data, and infrastructure security.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C27","name":"Perform Automated Security Updates for AI Models and Pipelines","desc":"Ensure AI models and APIs are updated regularly to mitigate security risks.","type":"Preventive/Corrective","assetType":"Processes, Models","cost":null},{"id":"C28","name":"Perform Automated Vulnerability Scans of Internal AI Assets","desc":"Scan internal AI assets (data storage, training, inference servers) for vulnerabilities quarterly or more frequently.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C29","name":"Establish and Maintain an AI Security Awareness Programme","desc":"Train employees on secure AI data handling, adversarial threats, and ethical AI considerations.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C30","name":"AI Security and Data Handling Training","desc":"Train employees on best practices for AI data management, recognising security incidents, and identifying update failures to strengthen overall AI system security.","type":"Preventive","assetType":"Actors/Stakeholders, Data","cost":null},{"id":"C31","name":"Establish and Maintain a Secure AI Development and Design","desc":"Implement a secure AI development lifecycle by following best coding practices, using trusted and verified frameworks and datasets, and applying security principles like least privilege access and input validation to mitigate risks in training, inference, and data privacy.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C32","name":"Conduct AI Penetration Testing","desc":"Test AI models against adversarial attacks to identify weaknesses and improve security.","type":"Preventive/Corrective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C33","name":"Conduct AI Threat Modelling","desc":"Analyse AI applications for potential threats such as data poisoning, model theft, and adversarial manipulation.","type":"Preventive","assetType":"Processes, Environment/Tools","cost":null},{"id":"C34","name":"Risk Measurement","desc":"Establish policies and procedures that address continual improvement processes for GAI risk measurement. Address general risks associated with a lack of explainability and transparency in GAI systems by using ample documentation and techniques such as: application of gradient-based attributions, occlusion/term reduction, counterfactual prompts and prompt engineering, and analysis of embeddings; Assess and update risk measurement approaches at regular cadences.","type":"Preventive/Corrective","assetType":"Data/Models","cost":null},{"id":"C35","name":"Team Training","desc":"Establish processes to verify the AI Actors conducting GAI incident response tasks demonstrate and maintain the appropriate skills and training.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C36","name":"Crisis Handling Plan","desc":"Establish incident response plans for third-party GAI technologies: Align incident response plans with impacts enumerated in MAP 5.1; Communicate third-party GAI incident response plans to all relevant AI Actors; Define ownership of GAI incident response functions; Rehearse third-party GAI incident response plans at a regular cadence; Improve incident response plans based on retrospective learning; Review incident response plans for alignment with relevant breach reporting, data protection, data privacy, or other laws.","type":"Corrective","assetType":"Processes/Environment/Tools","cost":null},{"id":"C37","name":"Role Clarity","desc":"Conduct joint educational activities and events in collaboration with third parties to promote best practices for managing GAI risks.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C38","name":"AI Awareness Training","desc":"Allocate time and resources for outreach, feedback, and recourse processes in GAI system development.","type":"Preventive","assetType":"Environment/Tools","cost":null},{"id":"C39","name":"AI Training Programmes","desc":"Include relevant AI Actors in the GAI system risk identification process.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C40","name":"Oversight Mechanisms","desc":"Consider adjustment of organisational roles and components across lifecycle stages of large or complex GAI systems, including: Test and evaluation, validation, and red-teaming of GAI systems; GAI content moderation; GAI system development and engineering; Increased accessibility of GAI tools, interfaces, and systems, Incident response and containment.","type":"Corrective","assetType":"Artefacts, Tools","cost":null},{"id":"C41","name":"Privacy Compliance","desc":"Align GAI development and use with applicable laws and regulations, including those related to data privacy, copyright and intellectual property law.","type":"Preventive","assetType":"Data","cost":null},{"id":"C42","name":"Regulatory Alignment","desc":"Consider the following factors when updating or defining risk tiers for GAI: Abuses and impacts to information integrity; Dependencies between GAI and other IT or data systems; Harm to fundamental rights or public safety; Presentation of obscene, objectionable, offensive, discriminatory, invalid or untruthful output; Psychological impacts to humans (e.g., anthropomorphisation, algorithmic aversion, emotional entanglement); Possibility for malicious use; Whether the system introduces significant new security vulnerabilities; Anticipated system impact on some groups compared to others; Unreliable decision making capabilities, validity, adaptability, and variability of GAI system performance over time.","type":"Preventive","assetType":"Data, Models, Processes, Actors/Stakeholders","cost":null},{"id":"C43","name":"IP Protection","desc":"Establish terms of use and terms of service for GAI systems.","type":"Preventive","assetType":"Models","cost":null},{"id":"C44","name":"Vendor Due Diligence","desc":"Update and integrate due diligence processes for GAI acquisition and procurement vendor assessments to include intellectual property, data privacy, security, and other risks. For example, update processes to: Address solutions that may rely on embedded GAI technologies; Address ongoing monitoring, assessments, and alerting, dynamic risk assessments, and real-time reporting tools for monitoring third-party GAI risks; Consider policy adjustments across GAI modelling libraries, tools and APIs, fine-tuned models, and embedded tools; Assess GAI vendors, open-source or proprietary GAI tools, or GAI service providers against incident or vulnerability databases.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C45","name":"Ethical AI Policies","desc":"Obtain input from stakeholder communities to identify unacceptable use, in accordance with activities in the AI RMF Map function.","type":"Preventive","assetType":"Artefacts","cost":null},{"id":"C46","name":"Data Quality Assurance","desc":"Ensure the reliability, completeness, and consistency of training and inference data by implementing validation mechanisms.","type":"Detective","assetType":"Data, Processes","cost":null},{"id":"C47","name":"Continuous Model Monitoring","desc":"Implement real-time surveillance of model performance, drift, and anomalies to detect deviations and security threats.","type":"Detective","assetType":"Models, Stakeholders, Processes","cost":null},{"id":"C48","name":"Secure Input Validation","desc":"Apply strict validation techniques to prevent adversarial or malformed inputs from compromising AI models.","type":"Detective","assetType":"Data, Environment/Tools","cost":null},{"id":"C49","name":"Bias Detection and Mitigation","desc":"Identify and reduce biases in AI models to promote fairness and prevent discriminatory outcomes.","type":"Detective","assetType":"Data, Stakeholders, Processes","cost":null},{"id":"C50","name":"Model Watermarking","desc":"Embed unique, invisible markers in AI models to trace unauthorised usage or leaks.","type":"Detective/Preventive","assetType":"Models, Artefacts","cost":null},{"id":"C51","name":"Model Encryption","desc":"Use cryptographic techniques to secure AI models against unauthorised access or tampering.","type":"Detective/Preventive","assetType":"Models","cost":null},{"id":"C52","name":"Secure AI Infrastructure","desc":"Ensure end-to-end security for AI systems, including hardware, software, and cloud environments.","type":"Detective/Preventive","assetType":"Artefacts, Environment/Tools","cost":null}],"assetThreat":[["A1","T8.1"],["A1","T8.4"],["A1.1","T1.1"],["A1.1","T1.9"],["A1.1","T5.9"],["A1.2","T1.4"],["A1.2","T1.5"],["A1.2","T1.6"],["A1.2","T1.7"],["A1.2","T1.8"],["A1.2","T1.9"],["A1.3","T1.2"],["A1.3","T1.4"],["A1.3","T1.9"],["A1.3","T2.2"],["A1.3","T5.1"],["A1.3","T5.10"],["A1.3","T5.12"],["A1.3","T5.13"],["A1.3","T5.14"],["A1.3","T5.2"],["A1.3","T5.9"],["A1.3","T8.1"],["A1.3","T8.4"]
