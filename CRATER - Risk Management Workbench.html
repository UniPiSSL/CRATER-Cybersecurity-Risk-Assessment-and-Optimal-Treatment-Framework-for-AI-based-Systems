5","name":"Processes","desc":"Critical workflows involved in AI system development and maintenance.","value":"H","exposure":"H"},{"id":"A5.1","name":"Data ingestion","desc":"The process of collecting and importing data from various sources.","value":"H","exposure":"H"},{"id":"A5.2","name":"Data pre-processing","desc":"Cleaning and transforming raw data into a usable format.","value":"H","exposure":"H"},{"id":"A5.3","name":"Data collection","desc":"Gathering data from multiple sources for model training and evaluation.","value":"H","exposure":"H"},{"id":"A5.4","name":"Data augmentation","desc":"Techniques used to artificially expand datasets to improve model performance.","value":"M","exposure":"M"},{"id":"A5.5","name":"Feature selection","desc":"Identifying relevant variables that contribute to a model's accuracy.","value":"M","exposure":"M"},{"id":"A5.6","name":"Training","desc":"The process of teaching an AI model using training datasets.","value":"H","exposure":"H"},{"id":"A5.7","name":"Tuning","desc":"Adjusting model parameters and hyper-parameters to optimise performance.","value":"H","exposure":"H"},{"id":"A5.8","name":"Model monitoring","desc":"Continuous tracking of AI model performance in production to detect drift.","value":"H","exposure":"H"},{"id":"A5.9","name":"Model retraining","desc":"Updating models periodically to adapt to new data and maintain accuracy.","value":"H","exposure":"H"},{"id":"A6","name":"Environment/Tools","desc":"Software and platforms that support AI model development and deployment.","value":"M","exposure":"M"},{"id":"A6.1","name":"Algorithm libraries","desc":"Prebuilt collections of algorithms used for AI and machine learning.","value":"M","exposure":"M"},{"id":"A6.2","name":"ML platforms","desc":"Cloud-based or local environments for training and deploying AI models.","value":"H","exposure":"H"},{"id":"A6.3","name":"Optimisation techniques","desc":"Methods used to enhance AI model performance and efficiency","value":"M","exposure":"M"},{"id":"A6.4","name":"Integrated development enviroments","desc":"Software tools that provide a workspace for coding, debugging, and testing AI applications.","value":"M","exposure":"M"},{"id":"A6.5","name":"Edge AI devices","desc":"Hardware that enables AI models to run locally on IoT devices or mobile phones.","value":"M","exposure":"M"},{"id":"A6.6","name":"Inference engines","desc":"Specialised frameworks for running trained AI models efficiently in production.","value":"H","exposure":"H"}],"legend":["Value (the importance off the asset in the total lifecycle of the AI system)","High (H): Essential for AI model functionality—without these, the system wouldn't work.","Medium (M): Important but not absolutely critical—losing them would impact efficiency, not functionality.","Low (L): Supportive assets that enhance AI but don’t directly impact core operations.","Risk exposure (Impact)","High (H): If compromised, could cause major harm (data breaches, model failure, AI bias, security risks).","Medium (M): Some risks exist but are manageable (explainability reports, metadata).","Low (L): Minimal risk (synthetic data, basic statistical parameters)."],"threats":[{"id":"T1","name":"Data risks","desc":""},{"id":"T1.1","name":"Input manipulation","desc":"Altering the input data provided to AI systems to intentionally mislead or skew outputs."},{"id":"T1.2","name":"Introducing of malicious samples into training data","desc":"Deliberate insertion of harmful or misleading data into training datasets, resulting in biased or compromised models."},{"id":"T1.3","name":"Data integrity breaches","desc":"Unauthorised modifications to the data, leading to corrupted training or inaccurate model predictions."},{"id":"T1.4","name":"Quality of the database","desc":"Poor quality datasets (e.g., incomplete, noisy, or outdated data) reducing the reliability and robustness of AI models."},{"id":"T1.5","name":"Data drift due to external factors such as reward hacking","desc":"Changes in real-world patterns or behaviours that render the model's learnt rules less effective,causing AI systems to exploit unintended behaviours in their objectives."},{"id":"T1.6","name":"Data drift due to seasonal changes","desc":"Periodic variations in data (e.g., e-commerce patterns) that reduce model accuracy over time."},{"id":"T1.7","name":"Data drift due to changes in processes","desc":"Organisational or operational changes altering the underlying data distribution, making the AI system less accurate."},{"id":"T1.8","name":"Concept drifts","desc":"When the relationship between input data and output labels changes over time, degrading the model's predictive power."},{"id":"T1.9","name":"Small dataset size","desc":"Training AI with insufficient data leads to biased, unreliable, or non-generalisable models."},{"id":"T2","name":"Attacks","desc":""},{"id":"T2.1","name":"Adversarial attacks","desc":"Small, imperceptible perturbations to input data that mislead AI systems"},{"id":"T2.2","name":"Poisoning attacks","desc":"Contaminating training data with malicious samples to degrade model performance or achieve specific outcomes."},{"id":"T2.3","name":"Inference attacks","desc":"Extracting sensitive information about the training dataset by observing the AI model’s outputs."},{"id":"T2.4","name":"Evasion attacks","desc":"Crafting inputs to avoid detection or bypass security mechanisms in AI-based systems."},{"id":"T2.5","name":"Extraction attacks","desc":"Reverse-engineering AI models to reconstruct sensitive data or proprietary algorithms."},{"id":"T2.6","name":"Membership Inference attacks","desc":"Identifying whether specific data points were part of the training dataset, potentially breaching privacy."},{"id":"T2.7","name":"Physical attacks","desc":"Manipulating the physical environment (e.g., stickers on stop signs) to deceive AI systems."},{"id":"T3","name":"Algorithm risks","desc":""},{"id":"T3.1","name":"Exploiting Generative AI","desc":"Using generative models to produce harmful outputs, such as deepfakes or malicious content."},{"id":"T3.2","name":"Model theft","desc":"Unauthorised duplication of proprietary AI models, leading to intellectual property loss and competitive disadvantages."},{"id":"T3.3","name":"Zero day vulnerabilities","desc":"Exploiting unknown or unpatched weaknesses in AI algorithms or their implementations."},{"id":"T4","name":"Operational risks","desc":""},{"id":"T4.1","name":"Compromise of reliability and safety of an AI system due to complex environments","desc":"Unpredictable interactions with dynamic environments causing failures."},{"id":"T4.2","name":"Responsiveness of the AI","desc":"Delays in AI system outputs during critical operations, affecting usability or safety."},{"id":"T4.3","name":"Loss of expressiveness of models","desc":"Models becoming overly simplified and unable to capture complex relationships."},{"id":"T4.4","name":"Specific failure cases","desc":"Unexpected failures under edge-case scenarios."},{"id":"T4.5","name":"Non continuous risk monitoring","desc":"Lack of real-time or ongoing risk evaluation, leading to undetected vulnerabilities or performance degradation."},{"id":"T4.6","name":"Non adequate maintenance","desc":"Lack of updates or adjustments causing models to degrade over time."},{"id":"T4.7","name":"Systems with continuous learning","desc":"AI systems that learn and adapt over time may incorporate unintended biases, security vulnerabilities, or errors due to lack of oversight."},{"id":"T5","name":"Legal - Privacy - Ethical risks-aspects","desc":""},{"id":"T5.1","name":"Fairness","desc":"Models that unintentionally or intentionally reinforce biases, leading to unequal treatment or outcomes."},{"id":"T5.2","name":"Privacy","desc":"Compromises of sensitive user data, either during data collection, processing, or sharing."},{"id":"T5.3","name":"Degree of automation and control","desc":"Excessive automation reducing human oversight, leading to unintended consequences or loss of accountability."},{"id":"T5.4","name":"Lack of transparency","desc":"Opaque decision-making processes, making AI actions hard to understand."},{"id":"T5.5","name":"Lack of traceability","desc":"Challenges in tracking data and processes used in training and deploying AI systems."},{"id":"T5.6","name":"Lack of explainability","desc":"Limited ability to explain how or why an AI model arrived at a specific decision."},{"id":"T5.7","name":"Lack of reproducibility","desc":"Difficulty replicating AI results due to inconsistencies in data, algorithms, or environments."},{"id":"T5.8","name":"High degree of transparency","desc":"Over-disclosure of model details or data potentially exposing sensitive or proprietary information."},{"id":"T5.9","name":"Data collection and surveillance","desc":"Excessive or unethical collection of personal data for AI training."},{"id":"T5.10","name":"Data misuse and unauthorised access","desc":"Exploiting or mishandling data, leading to legal and ethical breaches."},{"id":"T5.11","name":"Inference and Re-Identification risks","desc":"Deriving personally identifiable information from supposedly anonymised datasets."},{"id":"T5.12","name":"Bias-Discremination","desc":"Systematic unfairness due to flawed training data or biased algorithms."},{"id":"T5.13","name":"Lack of informed consent","desc":"Data subjects not being fully aware or agreeing to how their data is collected or used."},{"id":"T5.14","name":"Data sharing and Third-Party risks","desc":"Vulnerabilities introduced through external data sharing or partnerships."},{"id":"T5.15","name":"Deepfakes and synthetic data","desc":"Misuse of AI-generated content to deceive, manipulate, or harm."},{"id":"T5.16","name":"Autonomy and behavioural manipulation","desc":"Exploiting AI systems to unduly influence user behaviour or decision-making."},{"id":"T5.17","name":"Limited information communication to stake holders","desc":"Inadequate reporting or disclosure of AI risks, limitations, or decisions to business leaders, policymakers, or regulators."},{"id":"T5.18","name":"Limited information communication to end users","desc":"Users are not provided sufficient explanations about how AI decisions are made, leading to trust and usability concerns."},{"id":"T6","name":"Technical risks","desc":""},{"id":"T6.1","name":"Technical deficiencies","desc":"General inadequacies in AI models, such as incorrect assumptions, flawed architectures, or suboptimal implementations that reduce system reliability."},{"id":"T6.2","name":"Weaknesses in the system hardware / Hardware faults","desc":"Hardware components may fail, degrade, or be insufficiently robust, affecting AI model performance."},{"id":"T6.3","name":"Hardware failures capable of causing a non-negligible shift in model output","desc":"Connected with adversarial"},{"id":"T6.4","name":"System noise capable of causing a non-negligible shift in model output (Soft errors)","desc":"Incorrectly labelled, biased, or insufficiently diverse data can lead to inaccurate or harmful AI model outputs."},{"id":"T6.5","name":"Random hardware failures","desc":"AI models may unintentionally expose personal or sensitive data, violating data protection regulations and user privacy."},{"id":"T6.6","name":"Common cause failures","desc":"Failures originating from a single underlying issue, impacting multiple parts of the AI system simultaneously."},{"id":"T6.7","name":"Systematic failures","desc":"Consistent and repeatable errors in AI systems due to flaws in design, implementation, or training methodologies."},{"id":"T6.8","name":"Time-related program errors (race conditions, deadlocks, heisenbugs)","desc":"Failure to meet legal, regulatory, or ethical guidelines, leading to fines, reputational damage, or operational restrictions."},{"id":"T6.9","name":"Use of technologies with a lower level of maturity","desc":"Adoption of AI systems that rely on emerging or unproven technologies, leading to unexpected failures or security risks."},{"id":"T7","name":"Human variables","desc":""},{"id":"T7.1","name":"Absence of a critic","desc":"The lack of human oversight or critique, which could otherwise identify and correct flaws."},{"id":"T7.2","name":"Presence of a critic","desc":"Dependence on human intervention to identify and correct AI errors."},{"id":"T7.3","name":"Reaction times","desc":"Delayed human responses in critical AI failure scenarios."},{"id":"T7.4","name":"Understanding","desc":"Insufficient understanding of AI systems by users or developers leading to misuse or poor decision-making."},{"id":"T7.5","name":"Lack of experience","desc":"Inexperienced personnel causing errors in deploying or managing AI systems"},{"id":"T8","name":"Regulatory risks","desc":""},{"id":"T8.1","name":"Non compliance with data privacy laws","desc":"Violations of laws such as GDPR, CCPA, or similar regulations."},{"id":"T8.2","name":"Non compliance with AI-specifi regulations such as AI Act","desc":"Failure to meet legal requirements designed for AI deployment."},{"id":"T8.3","name":"Infringements of Intellectual Property and Copyright","desc":"Use of copyrighted material in training datasets or unauthorised duplication of AI models."},{"id":"T8.4","name":"Ethics and Human Rights violations","desc":"Breaches of ethical principles or fundamental rights due to AI system misuse."},{"id":"T8.5","name":"Non compliance with sector-specific regulations","desc":"Violations of rules specific to industries such as healthcare, finance, or transportation"},{"id":"T8.6","name":"Liability risk","desc":"Determining responsibility for AI-driven errors or damages can be legally complex and pose financial risks."},{"id":"T8.7","name":"Economic risk","desc":"AI-driven disruptions (e.g., automation, job loss, market volatility) can have negative economic impacts."}],"controls":[{"id":"C1","name":"Limit Public Release of Information","desc":"Limit the public release of technical information about the machine learning stack used in an organisation's products or services. Technical knowledge of how machine learning is used can be leveraged by adversaries to perform targeting and tailor attacks to the target system. Additionally, consider limiting the release of organisational information - including physical locations, researcher names, and department structures - from which technical details such as machine learning techniques, model architectures, or datasets may be inferred.","type":"Preventive","assetType":"Data, Environment/Tools","cost":null},{"id":"C2","name":"Limit Model Artefact Release","desc":"Limit public release of technical project details including data, algorithms, model architectures, and model checkpoints that are used in production, or that are representative of those used in production.","type":"Preventive","assetType":"Models, Artefacts","cost":null},{"id":"C3","name":"Passive ML Output Obfuscation","desc":"Decreasing the fidelity of model outputs provided to the end user can reduce an adversaries ability to extract information about the model and optimise attacks for the model.","type":"Preventive","assetType":"Models","cost":null},{"id":"C4","name":"Model Hardening","desc":"Use techniques to make machine learning models robust to adversarial inputs such as adversarial training or network distillation.","type":"Preventive/Corrective","assetType":"Models","cost":null},{"id":"C5","name":"Restrict Number of ML Model Queries","desc":"Limit the total number and rate of queries a user can perform.","type":"Preventive","assetType":"Processes","cost":null},{"id":"C6","name":"Control Access to ML Models and Data at Rest","desc":"Establish access controls on internal model registries and limit internal access to production models. Limit access to training data only to approved users.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C7","name":"Use Ensemble Methods","desc":"Use an ensemble of models for inference to increase robustness to adversarial inputs. Some attacks may effectively evade one model or model family but be ineffective against others.","type":"Preventive","assetType":"Models","cost":null},{"id":"C8","name":"Sanitise Training Data","desc":"Detect and remove or remediate poisoned training data. Training data should be sanitised prior to model training and recurrently for an active learning model. Implement a filter to limit ingested training data. Establish a content policy that would remove unwanted content such as certain explicit or offensive language from being used.","type":"Preventive/Corrective","assetType":"Data","cost":null},{"id":"C9","name":"Validate ML Model","desc":"Validate that machine learning models perform as intended by testing for backdoor triggers or adversarial bias. Monitor model for concept drift and training data drift, which may indicate data tampering and poisoning.","type":"Detective/Corrective","assetType":"Models","cost":null},{"id":"C10","name":"Use Multi-Modal Sensors","desc":"Incorporate multiple sensors to integrate varying perspectives and modalities to avoid a single point of failure susceptible to physical attacks.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C11","name":"Input Restoration","desc":"Preprocess all inference data to nullify or reverse potential adversarial perturbations.","type":"Preventive/Corrective","assetType":"Models, Processes","cost":null},{"id":"C12","name":"Restrict Library Loading","desc":"Prevent abuse of library loading mechanisms in the operating system and software to load untrusted code by configuring appropriate library loading mechanisms and investigating potential vulnerable software. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for loading of malicious libraries.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C13","name":"Encrypt Sensitive Information","desc":"Encrypt sensitive data such as ML models to protect against adversaries attempting to access sensitive data.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C14","name":"Code Signing","desc":"Enforce binary and application integrity with digital signature verification to prevent untrusted code from executing. Adversaries can embed malicious code in ML software or models. Enforcement of code signing can prevent the compromise of the machine learning supply chain and prevent execution of malicious code.","type":"Preventive","assetType":"Artefacts, Environment/Tools","cost":null},{"id":"C15","name":"Verify ML Artefacts","desc":"Verify the cryptographic checksum of all machine learning artefacts to verify that the file was not modified by an attacker.","type":"Preventive","assetType":"Artefacts, Models","cost":null},{"id":"C16","name":"Adversarial Input Detection","desc":"Detect and block adversarial inputs or atypical queries that deviate from known benign behaviour, exhibit behaviour patterns observed in previous attacks or that come from potentially malicious IPs. Incorporate adversarial detection algorithms into the ML system prior to the ML model.","type":"Preventive/Detective","assetType":"Processes, Models","cost":null},{"id":"C17","name":"Vulnerability Scanning","desc":"Vulnerability scanning is used to find potentially exploitable software vulnerabilities to remediate them. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for arbitrary code execution. Both model artefacts and downstream products produced by models should be scanned for known vulnerabilities.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C18","name":"Model Distribution Methods","desc":"Deploying ML models to edge devices can increase the attack surface of the system. Consider serving models in the cloud to reduce the level of access the adversary has to the model. Also consider computing features in the cloud to prevent grey-box attacks, where an adversary has access to the model preprocessing methods.","type":"Preventive/Corrective","assetType":"Models, Environment/Tools","cost":null},{"id":"C19","name":"User Training","desc":"Educate ML model developers on secure coding practices and ML vulnerabilities.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C20","name":"Control Access to ML Models and Data in Production","desc":"Require users to verify their identities before accessing a production model. Require authentication for API endpoints and monitor production model queries to ensure compliance with usage policies and to prevent model misuse.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C21","name":"Generative AI Guardrails","desc":"Guardrails are safety controls that are placed between a generative AI model and the output shared with the user to prevent undesired inputs and outputs. Guardrails can take the form of validators such as filters, rule-based logic, or regular expressions, as well as AI-based approaches, such as classifiers and utilising LLMs, or named entity recognition (NER) to evaluate the safety of the prompt or response. Domain specific methods can be employed to reduce risks in a variety of areas such as etiquette, brand damage, jailbreaking, false information, code exploits, SQL injections, and data leakage.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C22","name":"Generative AI Guidelines","desc":"Guidelines are safety controls that are placed between user-provided input and a generative AI model to help direct the model to produce desired outputs and prevent undesired outputs. Guidelines can be implemented as instructions appended to all user prompts or as part of the instructions in the system prompt. They can define the goal(s), role, and voice of the system, as well as outline safety and security parameters.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C23","name":"Generative AI Model Alignment","desc":"When training or fine-tuning a generative AI model it is important to utilise techniques that improve model alignment with safety, security, and content policies. The fine-tuning process can potentially remove built-in safety mechanisms in a generative AI model, but utilising techniques such as Supervised Fine-Tuning, Reinforcement Learning from Human Feedback or AI Feedback, and Targeted Safety Context Distillation can improve the safety and alignment of the model.","type":"Preventive","assetType":"Models, Processes","cost":null},{"id":"C24","name":"AI Telemetry Logging","desc":"Implement logging of inputs and outputs of deployed AI models. Monitoring logs can help to detect security threats and mitigate impacts.","type":"Preventive/Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C25","name":"Maintain AI Dataset Provenance","desc":"Maintain a detailed history of datasets used for AI applications. The history should include information about the dataset's source as well as a complete record of any modifications.","type":"Preventive","assetType":"Data, Artefacts","cost":null},{"id":"C26","name":"Establish and Maintain an AI Vulnerability Management Process","desc":"Document and update AI-specific vulnerability management processes, including model, data, and infrastructure security.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C27","name":"Perform Automated Security Updates for AI Models and Pipelines","desc":"Ensure AI models and APIs are updated regularly to mitigate security risks.","type":"Preventive/Corrective","assetType":"Processes, Models","cost":null},{"id":"C28","name":"Perform Automated Vulnerability Scans of Internal AI Assets","desc":"Scan internal AI assets (data storage, training, inference servers) for vulnerabilities quarterly or more frequently.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C29","name":"Establish and Maintain an AI Security Awareness Programme","desc":"Train employees on secure AI data handling, adversarial threats, and ethical AI considerations.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C30","name":"AI Security and Data Handling Training","desc":"Train employees on best practices for AI data management, recognising security incidents, and identifying update failures to strengthen overall AI system security.","type":"Preventive","assetType":"Actors/Stakeholders, Data","cost":null},{"id":"C31","name":"Establish and Maintain a Secure AI Development and Design","desc":"Implement a secure AI development lifecycle by following best coding practices, using trusted and verified frameworks and datasets, and applying security principles like least privilege access and input validation to mitigate risks in training, inference, and data privacy.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C32","name":"Conduct AI Penetration Testing","desc":"Test AI models against adversarial attacks to identify weaknesses and improve security.","type":"Preventive/Corrective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C33","name":"Conduct AI Threat Modelling","desc":"Analyse AI applications for potential threats such as data poisoning, model theft, and adversarial manipulation.","type":"Preventive","assetType":"Processes, Environment/Tools","cost":null},{"id":"C34","name":"Risk Measurement","desc":"Establish policies and procedures that address continual improvement processes for GAI risk measurement. Address general risks associated with a lack of explainability and transparency in GAI systems by using ample documentation and techniques such as: application of gradient-based attributions, occlusion/term reduction, counterfactual prompts and prompt engineering, and analysis of embeddings; Assess and update risk measurement approaches at regular cadences.","type":"Preventive/Corrective","assetType":"Data/Models","cost":null},{"id":"C35","name":"Team Training","desc":"Establish processes to verify the AI Actors conducting GAI incident response tasks demonstrate and maintain the appropriate skills and training.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C36","name":"Crisis Handling Plan","desc":"Establish incident response plans for third-party GAI technologies: Align incident response plans with impacts enumerated in MAP 5.1; Communicate third-party GAI incident response plans to all relevant AI Actors; Define ownership of GAI incident response functions; Rehearse third-party GAI incident response plans at a regular cadence; Improve incident response plans based on retrospective learning; Review incident response plans for alignment with relevant breach reporting, data protection, data privacy, or other laws.","type":"Corrective","assetType":"Processes/Environment/Tools","cost":null},{"id":"C37","name":"Role Clarity","desc":"Conduct joint educational activities and events in collaboration with third parties to promote best practices for managing GAI risks.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C38","name":"AI Awareness Training","desc":"Allocate time and resources for outreach, feedback, and recourse processes in GAI system development.","type":"Corrective","assetType":"Environment/Tools","cost":null},{"id":"C39","name":"AI Training Programmes","desc":"Include relevant AI Actors in the GAI system risk identification process.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C40","name":"Oversight Mechanisms","desc":"Consider adjustment of organisational roles and components across lifecycle stages of large or complex GAI systems, including: Test and evaluation, validation, and red-teaming of GAI systems; GAI content moderation; GAI system development and engineering; Increased accessibility of GAI tools, interfaces, and systems, Incident response and containment.","type":"Corrective","assetType":"Artefacts, Environment/Tools","cost":null},{"id":"C41","name":"Privacy Compliance","desc":"Align GAI development and use with applicable laws and regulations, including those related to data privacy, copyright and intellectual property law.","type":"Preventive","assetType":"Data","cost":null},{"id":"C42","name":"Regulatory Alignment","desc":"Consider the following factors when updating or defining risk tiers for GAI: Abuses and impacts to information integrity; Dependencies between GAI and other IT or data systems; Harm to fundamental rights or public safety; Presentation of obscene, objectionable, offensive, discriminatory, invalid or untruthful output; Psychological impacts to humans (e.g., anthropomorphisation, algorithmic aversion, emotional entanglement); Possibility for malicious use; Whether the system introduces significant new security vulnerabilities; Anticipated system impact on some groups compared to others; Unreliable decision making capabilities, validity, adaptability, and variability of GAI system performance over time.","type":"Preventive","assetType":"Data, Models, Processes, Actors/Stakeholders","cost":null},{"id":"C43","name":"IP Protection","desc":"Establish terms of use and terms of service for GAI systems.","type":"Preventive","assetType":"Models","cost":null},{"id":"C44","name":"Vendor Due Diligence","desc":"Update and integrate due diligence processes for GAI acquisition and procurement vendor assessments to include intellectual property, data privacy, security, and other risks. For example, update processes to: Address solutions that may rely on embedded GAI technologies; Address ongoing monitoring, assessments, and alerting, dynamic risk assessments, and real-time reporting tools for monitoring third-party GAI risks; Consider policy adjustments across GAI modelling libraries, tools and APIs, fine-tuned models, and embedded tools; Assess GAI vendors, open-source or proprietary GAI tools, or GAI service providers against incident or vulnerability databases.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C45","name":"Ethical AI Policies","desc":"Obtain input from stakeholder communities to identify unacceptable use, in accordance with activities in the AI RMF Map function.","type":"Preventive","assetType":"Artefacts","cost":null},{"id":"C46","name":"Data Quality Assurance","desc":"Ensure the reliability, completeness, and consistency of training and inference data by implementing validation mechanisms.","type":"Detective","assetType":"Data,Processes","cost":null},{"id":"C47","name":"Continuous Model Monitoring","desc":"Implement real-time surveillance of model performance, drift, and anomalies to detect deviations and security threats.","type":"Detective","assetType":"Models,Stakeholders,Processes","cost":null},{"id":"C48","name":"Secure Input Validation","desc":"Apply strict validation techniques to prevent adversarial or malformed inputs from compromising AI models.","type":"Detective","assetType":"Data, Environment/Tools","cost":null},{"id":"C49","name":"Bias Detection & Mitigation","desc":"Identify and reduce biases in AI models to promote fairness and prevent discriminatory outcomes.","type":"Detective","assetType":"Data,Stakeholders,Processes","cost":null},{"id":"C50","name":"Model Watermarking","desc":"Embed unique, invisible markers in AI models to trace unauthorised usage or leaks.","type":"Detective/Preventive","assetType":"Models,Artefacts","cost":null},{"id":"C51","name":"Model Encryption","desc":"Use cryptographic techniques to secure AI models against unauthorised access or tampering.","type":"Detective/Preventive","assetType":"Models","cost":null},{"id":"C52","name":"Secure AI Infrastructure","desc":"Ensure end-to-end security for AI systems, including hardware, software, and cloud environments.","type":"Detective/Preventive","assetType":"Artefacts,Environment/Tools","cost":null}],"assetThreat": const validOrdinal = x => Number.isInteger(x)&&x>=1&&x<=4;

const band = s => !number(s)||s<1||s>16?'Not assessed':s>=12?'Critical':s>=9?'High':s>=5?'Limited':'Minimal';

function efficacy(r) { return number(r.eff)&&r.eff>=0&&r.eff<=10?r.eff/10:null; }
function hasScope(r) { return r.scope==='case-study' || (!!asset[r.assetId]&&!isGroup(r.assetId)); }

function configured(r) { return validControl(r)&&efficacy(r)!==null&&number(r.cost)&&r.cost>=0&&!r.costNeedsReview&&!r.needsThreatReview; }

function totals() { const t={initial:0,final:0,cost:0,sel:0,eff:0,assessed:0,complete:0,accepted:0,untreated:0,invalid:0,applications:0};

function riskLabel(r){return r.threat+(r.assetId?' / '+r.assetId:'');}
function assessmentIssues() {

    if(!safeID(r.assessmentId)||ids.has(r.assessmentId))issues.push(`${riskLabel(r)}: duplicate or invalid record. Re-import a valid backup.`);ids.add(r.assessmentId);
    if(!safeID(r.applicationId)||apps.has(r.applicationId))issues.push(`${riskLabel(r)}: duplicate or invalid control application.`);apps.add(r.applicationId);
    if(!threat[r.threat]||isGroup(r.threat))issues.push(`${riskLabel(r)}: select an individual threat.`);
    if(!validScore(r))issues.push(`${riskLabel(r)}: choose likelihood and impact scores from 1 to 4.`);
    if(!hasScope(r))issues.push(`${riskLabel(r)}: assign the assessed asset.`);
    if(r.needsThreatReview)issues.push(`${riskLabel(r)}: confirm the updated threat definition.`);
    if(r.scope==='case-study'&&!r.assetId){if(caseThreats.has(r.threat))issues.push(`${r.threat}: repeated case-study assessment.`);caseThreats.add(r.threat);}

/* Exact additive budget selection for the risk register. */
function enumeratePortfolios(cs,budget,mode='red') {
  if(cs.length>MAX_CANDIDATES)throw Error(`Exact selection supports up to ${MAX_CANDIDATES} configured applications. Reduce the candidate set.`);
  if(!number(budget)||budget<0)throw Error('Set a finite non-negative budget.');
  const chosen=[];let visits=0,best=null;
  function walk(i,cost,value){
    if(++visits>2200000)throw Error('Selection limit reached; reduce the candidate set.');
    if(cost>budget+1e-9)return;
    if(i===cs.length){if(!best||value>best.value+1e-10||(Math.abs(value-best.value)<1e-10&&cost<best.cost))best={ids:chosen.map(j=>cs[j].applicationId),cost,value};return;}
    walk(i+1,cost,value);chosen.push(i);
    walk(i+1,cost+cs[i].cost,value+(mode==='eff'?cs[i].eff:score(cs[i])*efficacy(cs[i])));
    chosen.pop();
  }
  walk(0,0,0);return [best];
}

}

    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Asset</th><th>Description</th><th>In use</th><th>Value</th><th>Exposure</th><th class="num">Threats</th></tr></thead><tbody>${rows || `<tr><td colspan="7" class="muted">No assets match this filter.</td></tr>`}</tbody></table></div>`;

views.threats = () => {
  const answered = LIB.assets.some(a => a.inUse === true);

  let rows = "";

    if (!match("threats", t.id, t.name, t.desc)) continue;
    if (isGroup(t.id)) { if (LIB.threats.some(x => groupOf(x.id) === t.id && !isGroup(x.id) && relevant(x.id) && match("threats", x.id, x.name, x.desc))) rows += `<tr class="sec"><td colspan="6">${t.id} · ${esc(t.name)}</td></tr>`; continue; }
    if (!relevant(t.id)) continue;
    const as = (assetsOfThreat[t.id] || []).sort(idSort), cs = (controlsOfThreat[t.id] || []).sort(idSort), open = ui.open.has(t.id);
    rows += `<tr class="click" tabindex="0" data-act="toggle" data-id="${t.id}" aria-expanded="${open}"><td class="id">${t.id}</td><td><strong>${esc(t.name)}</strong>${inRegister(t.id) ? ` <span class="pill strat-Mitigate">In register</span>` : ""}</td><td class="desc">${esc(t.desc)}</td>
      <td class="num">${answered ? `${usedAssetsOf(t.id).length} <span class="muted">of ${as.length}</span>` : as.length}</td><td class="num">${cs.length}</td><td>${`<button class="btn small" data-act="add-risk" data-id="${t.id}">Add assessment</button>`}</td></tr>`;
    if (open) rows += `<tr class="detail"><td></td><td colspan="5"><div style="display:grid;gap:12px">
      <div><div class="eyebrow" style="margin-bottom:6px">Affected assets</div>${as.length ? `<div class="chips">${as.map(a => chip(a, asset[a].name + (asset[a].inUse === true ? " · in use" : ""), "goto-asset")).join("")}</div>` : `<span class="muted">None mapped.</span>`}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Mitigating controls</div>${cs.length ? `<div class="chips">${cs.map(c => chip(c, control[c].name, "goto-control")).join("")}</div>` : `<span class="muted">None mapped.</span>`}</div></div></td></tr>`;
  }
  return head("Threats", `${LIB.threats.filter(t => !isGroup(t.id)).length} AI threats in ${LIB.threats.filter(t => isGroup(t.id)).length} groups. Select a row to see affected assets and the controls that mitigate it.${answered ? " The Assets column counts assets your organisation uses." : ""}`,
      `<div class="toolbar">${answered ? `<label class="inline" for="relevant"><input type="checkbox" id="relevant" data-ui="relevant" ${ui.relevant ? "checked" : ""}>Only threats to assets in use</label>` : ""}${search("threats", "Search threats")}</div>`)
    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Threat</th><th>Description</th><th class="num">Assets</th><th class="num">Controls</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">No threats match your search.</td></tr>`}</tbody></table></div>`;
};

views.controls = () => {
  let rows = "";
  for (const c of DATA.controls) {
    if (!match("controls", c.id, c.name, c.desc, c.type, c.assetType)) continue;
    const ts = (threatsOfControl[c.id] || []).sort(idSort), open = ui.open.has(c.id);

  }
  return head("Controls", `${DATA.controls.length} controls. Names, types and asset associations follow S5; detailed descriptions are retained from the workbook. Select a row to see applicability mappings.`, `<div class="toolbar">${search("controls", "Search controls")}</div>`)
    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Control</th><th>Description</th><th>Type</th><th>Asset type</th><th class="num">Threats</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">No controls match your search.</td></tr>`}</tbody></table></div>`;
};

views.mappings = () => {
  const groups = LIB.threats.filter(t => isGroup(t.id));
  if (!groups.some(g => g.id === ui.mxGroup)) ui.mxGroup = groups[0]?.id;
  const subs = LIB.threats.filter(t => groupOf(t.id) === ui.mxGroup && !isGroup(t.id));
  const has = new Set((ui.mx === "at" ? LIB.assetThreat : LIB.threatControl).map(p => p.join("|")));
  let table, key;
  if (ui.mx === "at") {
    let body = "";
    for (const a of LIB.assets) {
      if (isGroup(a.id)) { body += `<tr class="sec"><td colspan="${subs.length + 1}">${a.id} · ${esc(a.name)}</td></tr>`; continue; }
      body += `<tr><td title="${esc(a.name)}"><span class="id">${a.id}</span> ${esc(a.name)}</td>${subs.map(t => `<td class="${has.has(a.id + "|" + t.id) ? "dot" : ""}" title="${esc(a.name)} × ${esc(t.name)}"></td>`).join("")}</tr>`;
    }
    table = `<table class="mx"><thead><tr><th>Asset \\ Threat</th>${subs.map(t => `<th title="${esc(t.name)}">${t.id}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
    key = subs.map(t => `<div><span class="id">${t.id}</span> ${esc(t.name)}</div>`).join("");
  } else {
    const cols = DATA.controls.filter(c => subs.some(t => has.has(t.id + "|" + c.id)));
    const body = subs.map(t => `<tr><td title="${esc(t.name)}"><span class="id">${t.id}</span> ${esc(t.name)}</td>${cols.map(c => `<td class="${has.has(t.id + "|" + c.id) ? "dot" : ""}" title="${esc(t.name)} × ${esc(c.name)}"></td>`).join("")}</tr>`).join("");
    table = cols.length ? `<table class="mx"><thead><tr><th>Threat \\ Control</th>${cols.map(c => `<th title="${esc(c.name)}">${c.id}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>` : `<p class="muted pad">No controls mapped to this group.</p>`;
    key = cols.map(c => `<div><span class="id">${c.id}</span> ${esc(c.name)}</div>`).join("");
  }
  return head("Mappings", "Detailed links and control applicability. These detailed asset links are retained workbook/user annotations, not an expansion of the published category matrix. A dot means an explicit association.")
    + `<div class="toolbar"><div class="chips" role="group" aria-label="Matrix">
        <button type="button" class="chip" data-act="mx" data-id="category">Category correlation (S3)</button><button type="button" class="chip ${ui.mx === "at" ? "on" : ""}" data-act="mx" data-id="at">Detailed assets × Threats</button>
        <button type="button" class="chip ${ui.mx === "tc" ? "on" : ""}" data-act="mx" data-id="tc">Threats × Controls</button></div></div>
      <div class="chips" role="group" aria-label="Threat group">${groups.map(g => `<button type="button" class="chip ${ui.mxGroup === g.id ? "on" : ""}" data-act="mxg" data-id="${g.id}"><span class="id">${g.id}</span>${esc(g.name)}</button>`).join("")}</div>
      <div class="panel scroll">${table}</div>
      <div class="panel pad"><div class="eyebrow" style="margin-bottom:8px">Key</div><div class="key">${key}</div></div>`;
};



const detailedMappings=views.mappings;

function threatOptions(selected){return LIB.threats.filter(t=>!isGroup(t.id)).map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.id+' · '+t.name)}</option>`).join('');}
views.identify=()=>{
  const options=LIB.threats.filter(t=>isGroup(t.id)).map(g=>`<optgroup label="${esc(g.id+' '+g.name)}">${LIB.threats.filter(t=>!isGroup(t.id)&&groupOf(t.id)===g.id).map(t=>`<option value="${esc(t.id)}">${esc(t.id+' '+t.name)}</option>`).join('')}</optgroup>`).join('');

  <td><select class="wide" id="asset-${k}" data-k="${k}" data-f="assetId" aria-label="Assessed asset">${assetOptions(r.assetId)}</select>${r.assets?`<div class="ctrl-desc">${esc(r.assets)}</div>`:''}</td>
  <td><input class="wide" id="owner-${k}" data-k="${k}" data-f="owner" value="${esc(r.owner)}" placeholder="Assign an owner" aria-label="Risk owner"></td>

  (S.risks.length?`<div class="panel scroll"><table><thead><tr><th>Threat / name</th><th>Assessed asset</th><th>Risk owner</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyRegister);

const LIKELIHOOD=['','Very Low','Low','High','Critical'],IMPACT=['','Negligible','Manageable','High','Critical'];
function ordinalSelect(r,k,f,labels){return `<select id="${f}-${k}" data-k="${k}" data-f="${f}" aria-label="${f==='l'?'Likelihood':'Impact'} for ${esc(r.threat)}"><option value="">Not assessed</option>${!validOrdinal(r[f])&&r[f]!=null?`<option selected value="${esc(r[f])}">Review: ${esc(r[f])}</option>`:''}${[1,2,3,4].map(i=>`<option value="${i}" ${r[f]===i?'selected':''}>${i} · ${labels[i]}</option>`).join('')}</select>`;}
views.assess=()=>{
  if(!S.risks.length)return head('2 · Assess risks','')+emptyRegister;
  const rows=S.risks.map((r,k)=>`<tr><td>${riskRef(r)}</td><td>${ordinalSelect(r,k,'l',LIKELIHOOD)}</td><td>${ordinalSelect(r,k,'i',IMPACT)}</td><td class="num"><strong>${fmt(score(r))}</strong></td><td><span class="pill b-${band(score(r)).replace(/\s/g,'')}">${band(score(r))}</span></td></tr>`).join('');
  const t=totals(),errors=assessmentIssues();let grid='';
  for(let i=4;i>=1;i--){grid+=`<div class="ax" title="${IMPACT[i]}">${i}</div>`;for(let l=1;l<=4;l++){const tags=S.risks.filter(r=>r.i===i&&r.l===l);grid+=`<div class="c b-${band(l*i)}" title="${LIKELIHOOD[l]} (${l}) × ${IMPACT[i]} (${i}) = ${l*i}, ${band(l*i)}">${tags.map(r=>`<span class="tag" title="${esc(r.threat+' · '+r.name)}">${esc(r.threat)}</span>`).join('')}</div>`;}}
  grid+='<div></div>'+[1,2,3,4].map(l=>`<div class="ax" title="${LIKELIHOOD[l]}">${l}</div>`).join('');
  return head('2 · Assess risks','Likelihood and impact use integer ordinal scores 1–4. Baseline score = likelihood × impact.')+
  problemBox(errors,'Assessment validation')+
  `<div class="assess"><div class="panel scroll"><table><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Score</th><th>Baseline rating</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">${t.invalid?'Partial total':'Total'}</td><td class="num">${fmt(t.initial)}</td><td>${errors.length?'Review pending':aggregateBand(t.initial,S.risks.length)}</td></tr></tfoot></table></div>
  <div class="panel pad"><h3>Risk heat map · 4 × 4</h3><div class="heat" role="img" aria-label="Four-level likelihood by impact matrix">${grid}</div><div class="heat-cap"><span>↑ Impact</span><span>Likelihood →</span></div><div class="legend small-legend"><div><span class="pill b-Minimal">Minimal</span>1–4</div><div><span class="pill b-Limited">Limited</span>5–8</div><div><span class="pill b-High">High</span>9–11</div><div><span class="pill b-Critical">Critical</span>12–16</div></div></div></div>
  <div class="panel pad"><h3>Organisation-level baseline classification</h3><p>For <strong>n = ${S.risks.length}</strong> assessed records, use [n, 5n), [5n, 9n), [9n, 12n), [12n, 16n]. The mean baseline score is <strong>${t.invalid?'not available':fmt(t.initial/S.risks.length)}</strong>. </p><p class="muted">Residual scores are reported numerically. These baseline intervals are not automatically applied to controlled scores, which may fall below n.</p></div>`;
};
views.evaluate=()=>{
  if(!S.risks.length)return head('3 · Evaluate controls','')+emptyRegister;
  const rows=S.risks.map((r,k)=>{const mapped=(controlsOfThreat[r.threat]||[]).sort(idSort),other=DATA.controls.map(c=>c.id).filter(c=>!mapped.includes(c));const opt=id=>`<option value="${id}" ${r.control===id?'selected':''}>${id} · ${esc(control[id].name)}</option>`;
    return `<tr><td>${riskRef(r)}</td><td><select class="wide" id="ctl-${k}" data-k="${k}" data-f="control" aria-label="Control"><option value="">No candidate control</option>${mapped.length?`<optgroup label="Mapped to this threat">${mapped.map(opt).join('')}</optgroup>`:''}<optgroup label="Other controls">${other.map(opt).join('')}</optgroup></select></td>
    <td><textarea id="why-${k}" data-k="${k}" data-f="why" aria-label="Control rationale">${esc(r.why)}</textarea></td>
    <td><input type="number" id="eff-${k}" data-k="${k}" data-f="eff" min="0" max="10" step="any" value="${esc(r.eff??'')}" ${!r.control?'disabled':''} aria-label="Effectiveness 0 to 10"><div class="ctrl-desc">e = ${efficacy(r)===null?'—':fmt(efficacy(r))}<br>S = ${efficacy(r)===null?'—':fmt(1-efficacy(r))}</div></td></tr>`;}).join('');
  return head('3 · Evaluate controls','Choose a control for each risk and rate its effectiveness from 0 to 10. For example, 6.3 corresponds to efficacy e = 0.63.')+
  `<div class="panel scroll"><table><thead><tr><th>Risk</th><th>Candidate control</th><th>Explanation</th><th>Effectiveness<br>(0–10)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};

views.treat=()=>{
  if(!S.risks.length)return head('4 · Treat risks','')+emptyRegister;
  const t=totals();
  const rows=S.risks.map((r,k)=>`<tr><td>${riskRef(r)}</td><td>${r.control?`<span class="id">${esc(r.control)}</span> ${esc(control[r.control]?.name||r.control)}`:'<span class="muted">No candidate control</span>'}</td>
  <td><input type="number" id="cost-${k}" data-k="${k}" data-f="cost" min="0" step="any" value="${esc(r.cost??'')}" ${!r.control?'disabled':''} aria-label="Application cost" style="width:90px">${r.costNeedsReview?'<div class="ctrl-desc">Re-enter to confirm legacy zero cost.</div>':''}</td><td class="num">${fmt(score(r))}</td><td class="num">${efficacy(r)===null?'—':fmt(efficacy(r))}</td><td class="num">${configured(r)?fmt(residual(r)):'—'}</td>
  <td><input type="checkbox" id="sel-${k}" data-k="${k}" data-f="sel" ${applied(r)?'checked':''} ${!configured(r)||!validScore(r)||!hasScope(r)?'disabled':''} aria-label="Apply ${esc(r.control)}"></td><td class="num"><strong>${fmt(finalScore(r))}</strong></td>
  <td>${applied(r)?'<span class="pill strat-Mitigate">Mitigate</span>':`<select id="decision-${k}" data-k="${k}" data-f="decision" aria-label="Treatment decision">${['Not treated','Accept','Avoid','Transfer'].map(d=>`<option ${strategy(r)===d?'selected':''}>${d}</option>`).join('')}</select>`}<input class="wide" id="note-${k}" data-k="${k}" data-f="treatmentNote" value="${esc(r.treatmentNote||'')}" placeholder="Decision rationale" aria-label="Treatment decision rationale"></td></tr>`).join('');
  return head('4 · Treat risks','Choose controls within budget and record how each risk will be treated.')+
  `<div class="panel pad toolbar"><label class="inline">Budget <input type="number" id="budget" data-g="budget" min="0" step="any" value="${S.budget}" style="width:100px"></label><label class="inline">Unit <select id="unit" data-g="unit">${['m.u.','EUR','USD','GBP'].map(u=>`<option ${S.unit===u?'selected':''}>${u}</option>`).join('')}</select></label>
  <label class="inline" for="objective">Optimise for <select id="objective" data-g="objective"><option value="red" ${S.objective==='red'?'selected':''}>Largest ordinal risk-score reduction</option><option value="eff" ${S.objective==='eff'?'selected':''}>Highest total effectiveness</option></select></label>
  <button class="btn primary" data-act="optimise">Find best selection</button><button class="btn" data-act="clear-selection">Clear selection</button><button class="btn" data-act="copy">Copy table</button><button class="btn" data-act="dl-json">Download results JSON</button></div>
  ${t.cost>S.budget?`<div class="note warn">Current spend exceeds the budget by ${monetary(t.cost-S.budget)}. This is not a budget-feasible recommendation.</div>`:''}${ui.msg?`<div role="status" class="note ${ui.msg.ok?'ok':'warn'}">${esc(ui.msg.text)}</div>`:''}
  
  <div class="panel scroll"><table><thead><tr><th>Risk</th><th>Control application</th><th>Cost (${esc(S.unit)})</th><th>Initial</th><th>Efficacy e</th><th>If applied</th><th>Apply</th><th>Final</th><th>Decision</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${fmt(t.cost)}</td><td class="num">${fmt(t.initial)}</td><td colspan="3"></td><td class="num">${fmt(t.final)}</td><td>${t.accepted} accepted</td></tr></tfoot></table></div>
  <p class="muted">Residual risk score = initial score × (1 − e). <br> Select a control to apply its reduction. Otherwise record the treatment decision. <br> Exact budget selection supports up to ${MAX_CANDIDATES} configured applications.</p>
  `;
};


/* CSV and JSON retain internal record identities for safe round trips. */
const COLS={
 assets:[['asset_id','Required','A component ID such as A1.1; an ID without a dot is a category.'],['asset_name','Required','Asset or category name.'],['description','Optional','Asset description.'],['value','Optional','H, M or L workbook annotation; not the ordinal risk score.'],['risk_exposure','Optional','H, M or L workbook annotation.'],['in_use','Optional','YES or NO. Blank preserves the current answer.']],
 threats:[['threat_id','Required','Threat ID, for example T1.2.'],['threat_name','Required','Name of this threat.'],['description','Optional','Library description; blank preserves it in merge mode.'],['affected_assets','Optional','Explicit detailed links, separated by semicolons; blank preserves, NONE clears.'],['mitigating_controls','Optional','Control IDs separated by semicolons; blank preserves, NONE clears.'],['in_register','Optional','YES adds/updates the assessment; NO removes the named assessment.'],['assessment_id','Optional','Unique assessment identity; required to disambiguate multiple rows for one threat.'],['asset_id','Optional','One component asset per assessment, such as A1.3.'],['scope','Optional','asset-pair or case-study.'],['risk_owner','Optional','Person or role accountable for this assessment.'],['likelihood','Optional','Integer 1–4; blank leaves a new row unassessed.'],['impact','Optional','Integer 1–4; blank leaves a new row unassessed.'],['control','Optional','C1–C52; NONE removes the candidate application.'],['application_id','Optional','Unique identity of this control application, not merely its control ID.'],['effectiveness','Optional','0–10, decimals allowed. 6.3 means efficacy 0.63.'],['efficacy','Optional','Equivalent 0–1 value. When both scales are supplied they must agree.'],['cost','Optional','Non-negative cost in monetary_unit; use a decimal point and no thousands separators. Blank is unknown, not free.'],['monetary_unit','Optional','m.u., EUR, USD or GBP; all rows must use the assessment’s unit. No currency conversion.'],['selected','Optional','YES or NO; YES requires complete, valid application parameters.'],['decision','Optional','Not treated, Accept, Avoid or Transfer. Selecting a control produces Mitigate.'],['treatment_note','Optional','Decision rationale.'],['assessment_name','Optional','Case-specific assessment name.']]
};
const csvCell=v=>{let s=String(v??'');return /[",;\n\r\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const toCsv=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function templateCsv(kind,src){
  const hdr=COLS[kind].map(c=>c[0]),example=src==='example';
  if(kind==='assets'){
    const xs=(example?REFERENCE.assets.filter(a=>['A1','A1.1','A1.3','A2','A2.2'].includes(a.id)):LIB.assets);
    return toCsv([hdr,...xs.map(a=>[a.id,a.name,a.desc,a.value,a.exposure,isGroup(a.id)?'':a.inUse===true?'YES':a.inUse===false?'NO':''])]);
  }

      case 'del':ui.confirm=k;break;
      case 'del-no':ui.confirm=null;break;
      case 'del-yes':S.risks.splice(k,1);ui.confirm=null;invalidate();save();break;
      case 'confirm-threat':if(r){r.needsThreatReview=false;r.name=threat[r.threat]?.name||r.name;invalidate();save();}break;
      case 'mx':ui.mx=id;break;
      case 'mxg':ui.mxGroup=id;break;
      case 'use-filter':ui.useFilter=id;break;
      case 'optimise':optimise();break;
      case 'clear-selection':for(const x of S.risks)x.sel=false;save();ui.msg=null;break;
      case 'preset':ui.preset=id;break;
      case 'preset-cancel':ui.preset=null;break;
      case 'preset-confirm':loadPreset(ui.preset);return;
      case 'backup':await downloadFile('crater-risk-workbench-backup.json',fullBackup());return;
      case 'previous-backup':{const p=readStorage('crater-risk-workbench-previous-backup');if(!p)toast('No previous browser backup exists yet.');else await downloadFile('crater-risk-workbench-previous-backup.json',JSON.stringify(p,null,2));return;}
      case 'dl-json':await downloadFile('crater-risk-treatment.json',treatmentJson());return;
      case 'copy':{const hdr=['Threat ID','Threat','Asset ID','Control ID','Cost ('+S.unit+')','Initial score','Efficacy','If applied','Selected','Final score','Decision'];const rows=S.risks.map(x=>[x.threat,x.name,x.assetId,x.control,x.cost,score(x),efficacy(x),configured(x)?residual(x):'',applied(x)?1:0,finalScore(x),strategy(x)]);await copyText([hdr,...rows].map(row=>row.map(v=>String(v??'').replace(/[\t\r\n]/g,' ')).join('\t')).join('\n'));return;}
      case 'tpl':ui.tpl=id;break;
      case 'tpl-src':ui.tplSrc=id;break;
      case 'tpl-copy':await copyText(document.getElementById('tpl-text').value);return;
      case 'download-template':await downloadCsv(`${ui.tpl}-${ui.tplSrc}.csv`,templateCsv(ui.tpl,ui.tplSrc));return;
      case 'imp-mode':ui.impMode=id;break;
      case 'imp-check-paste':ui.imp=checkCsv(ui.paste);ui.impDone=null;break;
      case 'imp-cancel':ui.imp=null;break;
      case 'imp-apply':ui.impDone=applyImport(ui.imp,ui.impMode);ui.imp=null;ui.paste='';break;
    }
  }catch(err){if(ui.view==='import')ui.imp={error:err.message};else ui.msg={ok:false,text:err.message};toast(err.message);}
  render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='imp-paste'){ui.paste=e.target.value;return;}
  const key=e.target.dataset.q;if(key!=null){ui.q[key]=e.target.value;render();}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='imp-file'){readFile(el.files[0]);el.value='';return;}
  if(el.id==='backup-file'){
    const f=el.files[0];if(!f)return;
    try{if(f.size>10*1024*1024)throw Error('JSON restore limit is 10 MB.');const obj=JSON.parse(await f.text());const checked=validatedBackup(obj);if(window.confirm('Restore this backup? The current assessment will be saved as the previous browser backup.'))restoreBackup(checked);}catch(err){toast(err.message);ui.imp={error:err.message};render();}el.value='';return;
  }
  if(el.dataset.use){const a=LIB.assets.find(x=>x.id===el.dataset.use);if(a){a.inUse=el.value==='yes'?true:el.value==='no'?false:undefined;save();}render();return;}
  if(el.dataset.ui){ui[el.dataset.ui]=el.checked;render();return;}
  if(el.dataset.g){
    const key=el.dataset.g;
    if(key==='budget'){const v=Number(el.value);if(!el.value.trim()||!number(v)||v<0){toast('Enter a finite non-negative budget.');render();return;}S.budget=v;}
    else if(key==='unit'){S.unit=el.value;toast('Monetary unit changed. Numeric costs have not been converted.');}
    else S[key]=el.value;
    invalidate();save();render();return;
  }
  if(el.dataset.f==null)return;
  const r=S.risks[Number(el.dataset.k)],f=el.dataset.f;if(!r)return;
  if(f==='sel'){
    if(el.checked&&(!configured(r)||!validScore(r)||!hasScope(r))){toast('Complete the assessment, cost and efficacy before applying the control.');render();return;}
    r.sel=el.checked;ui.msg=null;
  }else if(f==='control'){
    r.control=el.value;r.eff=null;r.cost=null;r.sel=false;r.why='';r.costNeedsReview=false;r.applicationId=newId(r.control||'APP');invalidate();
  }else if(f==='threat'){
    r.threat=el.value;r.name=threat[r.threat]?.name||r.threat;r.needsThreatReview=false;r.control='';r.eff=null;r.cost=null;r.sel=false;r.why='';r.scope=r.assetId?'asset-pair':'unassigned';invalidate();
  }else if(f==='assetId'){
    if(el.value&&S.risks.some(x=>x!==r&&x.threat===r.threat&&x.assetId===el.value)){toast('This threat–asset pair already has an assessment.');render();return;}
    r.assetId=el.value;if(el.value)r.scope='asset-pair';else if(r.scope!=='case-study')r.scope='asset-pair';invalidate();

  }else if(['l','i','eff','cost'].includes(f)){
    const v=el.value.trim()===''?null:Number(el.value),ok=v===null||(['l','i'].includes(f)?validOrdinal(v):number(v)&&v>=0&&(f==='eff'?v<=10:v<=1e15));
    if(!ok){toast(['l','i'].includes(f)?'Choose an integer score from 1 to 4.':'Enter a valid non-negative value within the field’s scale.');render();return;}
    r[f]=v;if(f==='cost')r.costNeedsReview=false;if(v===null)r.sel=false;invalidate();

  }else{
    r[f]=el.value;if(f==='decision'||f==='treatmentNote')r.decisionUpdatedAt=new Date().toISOString();if(!['owner','treatmentNote','decision','name','why'].includes(f))invalidate();
  }
  save();render();
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click')){e.preventDefault();e.target.click();}});
document.addEventListener('dragover',e=>{const z=e.target.closest?.('.drop');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>e.target.closest?.('.drop')?.classList.remove('over'));
document.addEventListener('drop',e=>{const z=e.target.closest?.('.drop');if(z){e.preventDefault();readFile(e.dataTransfer.files[0]);}});
const hash=location.hash.slice(1);if(VIEWS.some(v=>v.id===hash))ui.view=hash;
render();


</script></body></html>
