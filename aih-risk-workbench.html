<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: step rail on the left (top strip on phones), KPI band, one working view per process step */
:root {
  --bg: #F2F3F7; --surface: #FFFFFF; --sunk: #F7F8FB; --ink: #161A2C; --muted: #5A6177; --line: #DCDFE8;
  --accent: #2E47C6; --accent-ink: #FFFFFF; --accent-soft: #E7EBFB;
  --crit: #B8232F; --crit-bg: #FBE3E5; --high: #B9560F; --high-bg: #FCEADB; --lim: #8A6A00; --lim-bg: #FAF0CC; --low: #23794F; --low-bg: #DFF2E7;
  --mark: #2E47C6;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1120; --surface: #161A2B; --sunk: #12162504; --ink: #E6E8F2; --muted: #98A0B8; --line: #2A3048;
  --accent: #8C9EFF; --accent-ink: #0E1120; --accent-soft: #222A50;
  --crit: #FF7C86; --crit-bg: #3B1A22; --high: #FFA45E; --high-bg: #3A2616; --lim: #E9C74E; --lim-bg: #33290F; --low: #5FD39A; --low-bg: #12301F;
  --mark: #8C9EFF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1120; --surface: #161A2B; --sunk: #12162504; --ink: #E6E8F2; --muted: #98A0B8; --line: #2A3048;
  --accent: #8C9EFF; --accent-ink: #0E1120; --accent-soft: #222A50;
  --crit: #FF7C86; --crit-bg: #3B1A22; --high: #FFA45E; --high-bg: #3A2616; --lim: #E9C74E; --lim-bg: #33290F; --low: #5FD39A; --low-bg: #12301F;
  --mark: #8C9EFF; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
.id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.eyebrow { font-family: var(--f-display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 68ch; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.over > i { background: var(--crit); }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
nav.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
nav.steps .grp { margin: 14px 0 4px 10px; }
nav.steps .grp:first-child { margin-top: 0; }
nav.steps button { all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--ink); font-weight: 500; }
nav.steps button .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 14px; }
nav.steps button:hover { background: var(--accent-soft); }
nav.steps button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.steps button[aria-current="page"] .n { color: var(--accent-ink); opacity: .75; }
nav.steps button:focus-visible, .btn:focus-visible, .chip:focus-visible, tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main.view { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; }
.vhead p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel.pad { padding: 16px; }
.scroll { overflow-x: auto; }

table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.sec td { background: var(--accent-soft); font-family: var(--f-display); font-weight: 600; font-size: 13px; padding-block: 6px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
tr.detail td { background: var(--bg); }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
td.desc { color: var(--muted); min-width: 260px; max-width: 520px; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-Critical, .p-H { color: var(--crit); background: var(--crit-bg); }
.b-High { color: var(--high); background: var(--high-bg); }
.b-Limited, .p-M { color: var(--lim); background: var(--lim-bg); }
.b-Low, .p-L { color: var(--low); background: var(--low-bg); }
.strat-Mitigate { color: var(--accent); background: var(--accent-soft); }
.strat-Accept { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.chip .id { font-size: 11px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.on .id { color: var(--accent-ink); opacity: .8; }
.chip.static { cursor: default; }
.chip.static:hover { border-color: var(--line); }

.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.small { padding: 3px 9px; font-size: 12px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="number"] { width: 76px; font-variant-numeric: tabular-nums; text-align: right; }
input.wide, select.wide { width: 100%; min-width: 180px; }
textarea { width: 100%; min-width: 220px; resize: vertical; min-height: 56px; }
select.use { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 99px; }
select.use-yes { color: var(--low); background: var(--low-bg); border-color: transparent; }
select.use-no { color: var(--muted); background: var(--bg); }
select.use-unset { color: var(--lim); border-style: dashed; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type="search"] { min-width: 0; width: 280px; max-width: 100%; }
label.inline { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 500; max-width: 100%; min-width: 0; }
.toolbar select { max-width: 100%; min-width: 0; }

.note { font-size: 13px; color: var(--muted); padding: 10px 14px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 0 8px 8px 0; }
.note.ok { border-left-color: var(--low); }
.note.warn { border-left-color: var(--crit); color: var(--ink); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: baseline; }
.legend .pill { flex: none; }

/* risk assessment */
.assess { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.heat { display: grid; grid-template-columns: 26px repeat(5, minmax(0, 1fr)); gap: 3px; font-size: 11px; }
.heat .c { aspect-ratio: 1.25; max-width: 100%; border-radius: 4px; padding: 3px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px; }
.heat .ax { display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--f-mono); }
.heat .tag { font-family: var(--f-mono); font-size: 10px; font-weight: 500; background: var(--surface); color: var(--ink); border-radius: 3px; padding: 0 4px; line-height: 16px; border: 1px solid var(--line); }
.heat-cap { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; padding-left: 29px; }

/* matrices */
table.mx th, table.mx td { padding: 4px 6px; text-align: center; border: 1px solid var(--line); }
table.mx th:first-child, table.mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
table.mx tr.sec td { background: var(--accent-soft); }
table.mx th { font-family: var(--f-mono); font-size: 11px; text-transform: none; letter-spacing: 0; }
table.mx td.dot::after { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mark); }
.key { columns: 2 280px; column-gap: 24px; font-size: 13px; }
.key div { break-inside: avoid; padding: 2px 0; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
textarea.code { font-family: var(--f-mono); font-size: 12px; min-height: 150px; white-space: pre; overflow-x: auto; background: var(--bg); }
.issues { margin: 6px 0 0; padding-left: 18px; }
details summary { cursor: pointer; font-weight: 500; }
.ctrl-desc { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 46ch; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-weight: 500; z-index: 20; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.steps { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.steps .grp { display: none; }
  nav.steps button { white-space: nowrap; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .assess { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, nav.steps button { transition: background .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">AI system risk management</div>
      <h1>AIH Risk Workbench</h1>

  </div>

on large datasets and can be fine-tuned for specific tasks.","value":"M","exposure":"M"},{"id":"A2.6","name":"Model architectures","desc":"Structural design of models, such as CNNs for image recognition or Transformers for NLP.","value":"M","exposure":"M"},{"id":"A3","name":"Artefacts","desc":"Supporting components and governance structures essential for AI model management.","value":"M","exposure":"M"},{"id":"A3.1","name":"Data governance policies","desc":"Guidelines and protocols for managing data quality, security, and compliance.","value":"H","exposure":"H"},{"id":"A3.2","name":"Descriptive statistical parameters","desc":"Summary statistics used to analyze data distribution and characteristics.","value":"L","exposure":"L"},{"id":"A3.3","name":"Model frameworks","desc":"Predefined libraries and architectures that help develop AI models efficiently.","value":"M","exposure":"M"},{"id":"A4","name":"Actors/Stakeholders","desc":"Key individuals or groups involved in the AI development lifecycle.","value":"H","exposure":"H"},{"id":"A4.1","name":"Data owners","desc":"Individuals or organizations responsible for data access and management.","value":"H","exposure":"H"},{"id":"A4.2","name":"Data scientists","desc":"Professionals who design and implement AI models using statistical and machine-learning techniques.","value":"H","exposure":"H"},{"id":"A4.3","name":"Data engineers","desc":"Experts responsible for processing and managing large-scale datasets.","value":"H","exposure":"H"},{"id":"A4.4","name":"Model providers","desc":"Organizations or teams that develop and supply AI models for different applications.","value":"H","exposure":"H"},{"id":"A4.5","name":"MLOps Engineers","desc":"Professionals who manage AI model deployment, monitoring, and maintenance in production.","value":"H","exposure":"H"},{"id":"A4.6","name":"Ethics & Compliance Officers","desc":"Experts ensuring AI models adhere to ethical standards and legal regulations.","value":"H","exposure":"H"},{"id":"A5","name":"Processes","desc":"Critical workflows involved in AI system development and maintenance.","value":"H","exposure":"H"},{"id":"A5.1","name":"Data ingestion","desc":"The process of collecting and importing data from various sources.","value":"H","exposure":"H"},{"id":"A5.2","name":"Data pre-processing","desc":"Cleaning and transforming raw data into a usable format.","value":"H","exposure":"H"},{"id":"A5.3","name":"Data collection","desc":"Gathering data from multiple sources for model training and evaluation.","value":"H","exposure":"H"},{"id":"A5.4","name":"Data augmentation","desc":"Techniques used to artificially expand datasets to improve model performance.","value":"M","exposure":"M"},{"id":"A5.5","name":"Feature selection","desc":"Identifying relevant variables that contribute to a model's accuracy.","value":"M","exposure":"M"},{"id":"A5.6","name":"Training","desc":"The process of teaching an AI model using training datasets.","value":"H","exposure":"H"},{"id":"A5.7","name":"Tuning","desc":"Adjusting model parameters and hyper-parameters to optimize performance.","value":"H","exposure":"H"},{"id":"A5.8","name":"Model monitoring","desc":"Continuous tracking of AI model performance in production to detect drift.","value":"H","exposure":"H"},{"id":"A5.9","name":"Model retraining","desc":"Updating models periodically to adapt to new data and maintain accuracy.","value":"H","exposure":"H"},{"id":"A6","name":"Environment/Tools","desc":"Software and platforms that support AI model development and deployment.","value":"M","exposure":"M"},{"id":"A6.1","name":"Algorithm libraries","desc":"Prebuilt collections of algorithms used for AI and machine learning.","value":"M","exposure":"M"},{"id":"A6.2","name":"ML platforms","desc":"Cloud-based or local environments for training and deploying AI models.","value":"H","exposure":"H"},{"id":"A6.3","name":"Optimisation techniques","desc":"Methods used to enhance AI model performance and efficiency","value":"M","exposure":"M"},{"id":"A6.4","name":"Integrated development enviroments","desc":"Software tools that provide a workspace for coding, debugging, and testing AI applications.","value":"M","exposure":"M"},{"id":"A6.5","name":"Edge AI devices","desc":"Hardware that enables AI models to run locally on IoT devices or mobile phones.","value":"M","exposure":"M"},{"id":"A6.6","name":"Inference engines","desc":"Specialized frameworks for running trained AI models efficiently in production.","value":"H","exposure":"H"}],"legend":["Value (the importance off the asset in the total lifecycle of the AI system)","High (H): Essential for AI model functionality—without these, the system wouldn't work.","Medium (M): Important but not absolutely critical—losing them would impact efficiency, not functionality.","Low (L): Supportive assets that enhance AI but don’t directly impact core operations.","Risk exposure (Impact)","High (H): If compromised, could cause major harm (data breaches, model failure, AI bias, security risks).","Medium (M): Some risks exist but are manageable (explainability reports, metadata).","Low (L): Minimal risk (synthetic data, basic statistical parameters)."],"threats":[{"id":"T1","name":"Data risks","desc":""},{"id":"T1.1","name":"Input manipulation","desc":"Altering the input data provided to AI systems to intentionally mislead or skew outputs."},{"id":"T1.2","name":"Introducing of malicious samples into training data","desc":"Deliberate insertion of harmful or misleading data into training datasets, resulting in biased or compromised models."},{"id":"T1.3","name":"Data integrity breaches","desc":"Unauthorized modifications to the data, leading to corrupted training or inaccurate model predictions."},{"id":"T1.4","name":"Quality of the database","desc":"Poor quality datasets (e.g., incomplete, noisy, or outdated data) reducing the reliability and robustness of AI models."},{"id":"T1.5","name":"Data drift due to external factors such as reward hacking","desc":"Changes in real-world patterns or behaviors that render the model's learned rules less effective,causing AI systems to exploit unintended behaviors in their objectives."},{"id":"T1.6","name":"Data drift due to seasonal changes","desc":"Periodic variations in data (e.g., e-commerce patterns) that reduce model accuracy over time."},{"id":"T1.7","name":"Data drift due to changes in processes","desc":"Organizational or operational changes altering the underlying data distribution, making the AI system less accurate."},{"id":"T1.8","name":"Concept drifts","desc":"When the relationship between input data and output labels changes over time, degrading the model's predictive power."},{"id":"T1.9","name":"Small dataset size","desc":"Training AI with insufficient data leads to biased, unreliable, or non-generalisable models."},{"id":"T2","name":"Attacks","desc":""},{"id":"T2.1","name":"Adversarial attacks","desc":"Small, imperceptible perturbations to input data that mislead AI systems"},{"id":"T2.2","name":"Poisoning attacks","desc":"Contaminating training data with malicious samples to degrade model performance or achieve specific outcomes."},{"id":"T2.3","name":"Inference attacks","desc":"Extracting sensitive information about the training dataset by observing the AI model’s outputs."},{"id":"T2.4","name":"Evasion attacks","desc":"Crafting inputs to avoid detection or bypass security mechanisms in AI-based systems."},{"id":"T2.5","name":"Extraction attacks","desc":"Reverse-engineering AI models to reconstruct sensitive data or proprietary algorithms."},{"id":"T2.6","name":"Membership Inference attacks","desc":"Identifying whether specific data points were part of the training dataset, potentially breaching privacy."},{"id":"T2.7","name":"Physical attacks","desc":"Manipulating the physical environment (e.g., stickers on stop signs) to deceive AI systems."},{"id":"T3","name":"Algorithm risks","desc":""},{"id":"T3.1","name":"Exploiting Generative AI","desc":"Using generative models to produce harmful outputs, such as deepfakes or malicious content."},{"id":"T3.2","name":"Model theft","desc":"Unauthorized duplication of proprietary AI models, leading to intellectual property loss and competitive disadvantages."},{"id":"T3.3","name":"Zero day vulnerabilities","desc":"Exploiting unknown or unpatched weaknesses in AI algorithms or their implementations."},{"id":"T4","name":"Operational risks","desc":""},{"id":"T4.1","name":"Compromise of reliability and safety of an AI system due to complex environments","desc":"Unpredictable interactions with dynamic environments causing failures."},{"id":"T4.2","name":"Responsiveness of the AI","desc":"Delays in AI system outputs during critical operations, affecting usability or safety."},{"id":"T4.3","name":"Loss of expressiveness of models","desc":"Models becoming overly simplified and unable to capture complex relationships."},{"id":"T4.4","name":"Specific failure cases","desc":"Unexpected failures under edge-case scenarios."},{"id":"T4.5","name":"Non continuous risk monitoring","desc":"Lack of real-time or ongoing risk evaluation, leading to undetected vulnerabilities or performance degradation."},{"id":"T4.6","name":"Non adequate maintenance","desc":"Lack of updates or adjustments causing models to degrade over time."},{"id":"T4.7","name":"Systems with continuous learning","desc":"AI systems that learn and adapt over time may incorporate unintended biases, security vulnerabilities, or errors due to lack of oversight."},{"id":"T5","name":"Legal - Privacy - Ethical risks-aspects","desc":""},{"id":"T5.1","name":"Fairness","desc":"Models that unintentionally or intentionally reinforce biases, leading to unequal treatment or outcomes."},{"id":"T5.2","name":"Privacy","desc":"Compromises of sensitive user data, either during data collection, processing, or sharing."},{"id":"T5.3","name":"Degree of automation and control","desc":"Excessive automation reducing human oversight, leading to unintended consequences or loss of accountability."},{"id":"T5.4","name":"Lack of transparency","desc":"Opaque decision-making processes, making AI actions hard to understand."},{"id":"T5.5","name":"Lack of traceability","desc":"Challenges in tracking data and processes used in training and deploying AI systems."},{"id":"T5.6","name":"Lack of explainability","desc":"Limited ability to explain how or why an AI model arrived at a specific decision."},{"id":"T5.7","name":"Lack of reproducibility","desc":"Difficulty replicating AI results due to inconsistencies in data, algorithms, or environments."},{"id":"T5.8","name":"High degree of transparency","desc":"Over-disclosure of model details or data potentially exposing sensitive or proprietary information."},{"id":"T5.9","name":"Data collection and surveillance","desc":"Excessive or unethical collection of personal data for AI training."},{"id":"T5.10","name":"Data misuse and unauthorised access","desc":"Exploiting or mishandling data, leading to legal and ethical breaches."},{"id":"T5.11","name":"Inference and Re-Identification risks","desc":"Deriving personally identifiable information from supposedly anonymized datasets."},{"id":"T5.12","name":"Bias-Discremination","desc":"Systematic unfairness due to flawed training data or biased algorithms."},{"id":"T5.13","name":"Lack of informed consent","desc":"Data subjects not being fully aware or agreeing to how their data is collected or used."},{"id":"T5.14","name":"Data sharing and Third-Party risks","desc":"Vulnerabilities introduced through external data sharing or partnerships."},{"id":"T5.15","name":"Deepfakes and synthetic data","desc":"Misuse of AI-generated content to deceive, manipulate, or harm."},{"id":"T5.16","name":"Autonomy and behavioral manipulation","desc":"Exploiting AI systems to unduly influence user behavior or decision-making."},{"id":"T5.17","name":"Limited information communication to stake holders","desc":"Inadequate reporting or disclosure of AI risks, limitations, or decisions to business leaders, policymakers, or regulators."},{"id":"T5.18","name":"Limited information communication to end users","desc":"Users are not provided sufficient explanations about how AI decisions are made, leading to trust and usability concerns."},{"id":"T6","name":"Technical risks","desc":""},{"id":"T6.1","name":"Technical deficiencies","desc":"General inadequacies in AI models, such as incorrect assumptions, flawed architectures, or suboptimal implementations that reduce system reliability."},{"id":"T6.2","name":"Weaknesses in the system hardware / Hardware faults","desc":"Hardware components may fail, degrade, or be insufficiently robust, affecting AI model performance."},{"id":"T6.3","name":"Hardware failures capable of causing a non-negligible shift in model output","desc":"Connected with adversarial"},{"id":"T6.4","name":"System noise capable of causing a non-negligible shift in model output (Soft errors)","desc":"Incorrectly labeled, biased, or insufficiently diverse data can lead to inaccurate or harmful AI model outputs."},{"id":"T6.5","name":"Random hardware failures","desc":"AI models may unintentionally expose personal or sensitive data, violating data protection regulations and user privacy."},{"id":"T6.6","name":"Common cause failures","desc":"Failures originating from a single underlying issue, impacting multiple parts of the AI system simultaneously."},{"id":"T6.7","name":"Systematic failures","desc":"Consistent and repeatable errors in AI systems due to flaws in design, implementation, or training methodologies."},{"id":"T6.8","name":"Time-related programme errors (race conditions, deadlocks, heisenbugs)","desc":"Failure to meet legal, regulatory, or ethical guidelines, leading to fines, reputational damage, or operational restrictions."},{"id":"T6.9","name":"Use of technologies with a lower level of maturity","desc":"Adoption of AI systems that rely on emerging or unproven technologies, leading to unexpected failures or security risks."},{"id":"T7","name":"Human variables","desc":""},{"id":"T7.1","name":"Absence of a critic","desc":"The lack of human oversight or critique, which could otherwise identify and correct flaws."},{"id":"T7.2","name":"Presence of a critic","desc":"Dependence on human intervention to identify and correct AI errors."},{"id":"T7.3","name":"Reaction times","desc":"Delayed human responses in critical AI failure scenarios."},{"id":"T7.4","name":"Understanding","desc":"Insufficient understanding of AI systems by users or developers leading to misuse or poor decision-making."},{"id":"T7.5","name":"Lack of experience","desc":"Inexperienced personnel causing errors in deploying or managing AI systems"},{"id":"T8","name":"Regulatory risks","desc":""},{"id":"T8.1","name":"Non compliance with data privacy laws","desc":"Violations of laws such as GDPR, CCPA, or similar regulations."},{"id":"T8.2","name":"Non compliance with AI-specifi regulations such as AI Act","desc":"Failure to meet legal requirements designed for AI deployment."},{"id":"T8.3","name":"Infringements of Intellectual Property and Copyright","desc":"Use of copyrighted material in training datasets or unauthorized duplication of AI models."},{"id":"T8.4","name":"Ethics and Human Rights violations","desc":"Breaches of ethical principles or fundamental rights due to AI system misuse."},{"id":"T8.5","name":"Non compliance with sector-specific regulations","desc":"Violations of rules specific to industries such as healthcare, finance, or transportation"},{"id":"T8.6","name":"Liability risk","desc":"Determining responsibility for AI-driven errors or damages can be legally complex and pose financial risks."},{"id":"T8.7","name":"Economic risk","desc":"AI-driven disruptions (e.g., automation, job loss, market volatility) can have negative economic impacts."}],"controls":[{"id":"C1","name":"Limit Public Release of Information","desc":"Limit the public release of technical information about the machine learning stack used in an organization's products or services. Technical knowledge of how machine learning is used can be leveraged by adversaries to perform targeting and tailor attacks to the target system. Additionally, consider limiting the release of organizational information - including physical locations, researcher names, and department structures - from which technical details such as machine learning techniques, model architectures, or datasets may be inferred.","type":"Preventive","assetType":"Data, Environment/Tools","cost":null},{"id":"C2","name":"Limit Model Artifact Release","desc":"Limit public release of technical project details including data, algorithms, model architectures, and model checkpoints that are used in production, or that are representative of those used in production.","type":"Preventive","assetType":"Models, Artefacts","cost":null},{"id":"C3","name":"Passive ML Output Obfuscation","desc":"Decreasing the fidelity of model outputs provided to the end user can reduce an adversaries ability to extract information about the model and optimize attacks for the model.","type":"Preventive","assetType":"Models","cost":null},{"id":"C4","name":"Model Hardening","desc":"Use techniques to make machine learning models robust to adversarial inputs such as adversarial training or network distillation.","type":"Preventive/Corrective","assetType":"Models","cost":null},{"id":"C5","name":"Restrict Number of ML Model Queries","desc":"Limit the total number and rate of queries a user can perform.","type":"Preventive","assetType":"Processes","cost":null},{"id":"C6","name":"Control Access to ML Models and Data at Rest","desc":"Establish access controls on internal model registries and limit internal access to production models. Limit access to training data only to approved users.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C7","name":"Use Ensemble Methods","desc":"Use an ensemble of models for inference to increase robustness to adversarial inputs. Some attacks may effectively evade one model or model family but be ineffective against others.","type":"Preventive","assetType":"Models","cost":null},{"id":"C8","name":"Sanitize Training Data","desc":"Detect and remove or remediate poisoned training data. Training data should be sanitized prior to model training and recurrently for an active learning model. Implement a filter to limit ingested training data. Establish a content policy that would remove unwanted content such as certain explicit or offensive language from being used.","type":"Preventive/Corrective","assetType":"Data","cost":null},{"id":"C9","name":"Validate ML Model","desc":"Validate that machine learning models perform as intended by testing for backdoor triggers or adversarial bias. Monitor model for concept drift and training data drift, which may indicate data tampering and poisoning.","type":"Detective/Corrective","assetType":"Models","cost":null},{"id":"C10","name":"Use Multi-Modal Sensors","desc":"Incorporate multiple sensors to integrate varying perspectives and modalities to avoid a single point of failure susceptible to physical attacks.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C11","name":"Input Restoration","desc":"Preprocess all inference data to nullify or reverse potential adversarial perturbations.","type":"Preventive/Corrective","assetType":"Models, Processes","cost":null},{"id":"C12","name":"Restrict Library Loading","desc":"Prevent abuse of library loading mechanisms in the operating system and software to load untrusted code by configuring appropriate library loading mechanisms and investigating potential vulnerable software. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for loading of malicious libraries.","type":"Preventive/Corrective","assetType":"Environment/Tools","cost":null},{"id":"C13","name":"Encrypt Sensitive Information","desc":"Encrypt sensitive data such as ML models to protect against adversaries attempting to access sensitive data.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C14","name":"Code Signing","desc":"Enforce binary and application integrity with digital signature verification to prevent untrusted code from executing. Adversaries can embed malicious code in ML software or models. Enforcement of code signing can prevent the compromise of the machine learning supply chain and prevent execution of malicious code.","type":"Preventive","assetType":"Artefacts, Environment/Tools","cost":null},{"id":"C15","name":"Verify ML Artifacts","desc":"Verify the cryptographic checksum of all machine learning artifacts to verify that the file was not modified by an attacker.","type":"Preventive","assetType":"Artefacts, Models","cost":null},{"id":"C16","name":"Adversarial Input Detection","desc":"Detect and block adversarial inputs or atypical queries that deviate from known benign behavior, exhibit behavior patterns observed in previous attacks or that come from potentially malicious IPs. Incorporate adversarial detection algorithms into the ML system prior to the ML model.","type":"Preventive/Detective","assetType":"Processes, Models","cost":null},{"id":"C17","name":"Vulnerability Scanning","desc":"Vulnerability scanning is used to find potentially exploitable software vulnerabilities to remediate them. File formats such as pickle files that are commonly used to store machine learning models can contain exploits that allow for arbitrary code execution. Both model artifacts and downstream products produced by models should be scanned for known vulnerabilities.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C18","name":"Model Distribution Methods","desc":"Deploying ML models to edge devices can increase the attack surface of the system. Consider serving models in the cloud to reduce the level of access the adversary has to the model. Also consider computing features in the cloud to prevent gray-box attacks, where an adversary has access to the model preprocessing methods.","type":"Preventive/Corrective","assetType":"Models, Environment/Tools","cost":null},{"id":"C19","name":"User Training","desc":"Educate ML model developers on secure coding practices and ML vulnerabilities.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C20","name":"Control Access to ML Models and Data in Production","desc":"Require users to verify their identities before accessing a production model. Require authentication for API endpoints and monitor production model queries to ensure compliance with usage policies and to prevent model misuse.","type":"Preventive","assetType":"Data, Models","cost":null},{"id":"C21","name":"Generative AI Guardrails","desc":"Guardrails are safety controls that are placed between a generative AI model and the output shared with the user to prevent undesired inputs and outputs. Guardrails can take the form of validators such as filters, rule-based logic, or regular expressions, as well as AI-based approaches, such as classifiers and utilizing LLMs, or named entity recognition (NER) to evaluate the safety of the prompt or response. Domain specific methods can be employed to reduce risks in a variety of areas such as etiquette, brand damage, jailbreaking, false information, code exploits, SQL injections, and data leakage.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C22","name":"Generative AI Guidelines","desc":"Guidelines are safety controls that are placed between user-provided input and a generative AI model to help direct the model to produce desired outputs and prevent undesired outputs. Guidelines can be implemented as instructions appended to all user prompts or as part of the instructions in the system prompt. They can define the goal(s), role, and voice of the system, as well as outline safety and security parameters.","type":"Preventive","assetType":"Artefacts, Processes","cost":null},{"id":"C23","name":"Generative AI Model Alignment","desc":"When training or fine-tuning a generative AI model it is important to utilize techniques that improve model alignment with safety, security, and content policies. The fine-tuning process can potentially remove built-in safety mechanisms in a generative AI model, but utilizing techniques such as Supervised Fine-Tuning, Reinforcement Learning from Human Feedback or AI Feedback, and Targeted Safety Context Distillation can improve the safety and alignment of the model.","type":"Preventive","assetType":"Models, Processes","cost":null},{"id":"C24","name":"AI Telemetry Logging","desc":"Implement logging of inputs and outputs of deployed AI models. Monitoring logs can help to detect security threats and mitigate impacts.","type":"Preventive/Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C25","name":"Maintain AI Dataset Provenance","desc":"Maintain a detailed history of datasets used for AI applications. The history should include information about the dataset's source as well as a complete record of any modifications.","type":"Preventive","assetType":"Data, Artefacts","cost":null},{"id":"C26","name":"Establish and Maintain an AI Vulnerability Management Process","desc":"Document and update AI-specific vulnerability management processes, including model, data, and infrastructure security.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C27","name":"Perform Automated Security Updates for AI Models and Pipelines","desc":"Ensure AI models and APIs are updated regularly to mitigate security risks.","type":"Preventive/Corrective","assetType":"Processes, Models","cost":null},{"id":"C28","name":"Perform Automated Vulnerability Scans of Internal AI Assets","desc":"Scan internal AI assets (data storage, training, inference servers) for vulnerabilities quarterly or more frequently.","type":"Detective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C29","name":"Establish and Maintain an AI Security Awareness Program","desc":"Train employees on secure AI data handling, adversarial threats, and ethical AI considerations.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C30","name":"AI Security and Data Handling Training","desc":"Train employees on best practices for AI data management, recognizing security incidents, and identifying update failures to strengthen overall AI system security.","type":"Preventive","assetType":"Actors/Stakeholders, Data","cost":null},{"id":"C31","name":"Establish and Maintain a Secure AI Development and Design","desc":"Implement a secure AI development lifecycle by following best coding practices, using trusted and verified frameworks and datasets, and applying security principles like least privilege access and input validation to mitigate risks in training, inference, and data privacy.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C32","name":"Conduct AI Penetration Testing","desc":"Test AI models against adversarial attacks to identify weaknesses and improve security.","type":"Preventive/Corrective","assetType":"Processes, Environment/Tools","cost":null},{"id":"C33","name":"Conduct AI Threat Modeling","desc":"Analyze AI applications for potential threats such as data poisoning, model theft, and adversarial manipulation.","type":"Preventive","assetType":"Processes, Environment/Tools","cost":null},{"id":"C34","name":"Risk Measurement","desc":"Establish policies and procedures that address continual improvement processes for GAI risk measurement. Address general risks associated with a lack of explainability and transparency in GAI systems by using ample documentation and techniques such as: application of gradient-based attributions, occlusion/term reduction, counterfactual prompts and prompt engineering, and analysis of embeddings; Assess and update risk measurement approaches at regular cadences.","type":"Preventive/Corrective","assetType":"Data/Models","cost":null},{"id":"C35","name":"Team Training","desc":"Establish processes to verify the AI Actors conducting GAI incident response tasks demonstrate and maintain the appropriate skills and training.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C36","name":"Crisis Handling Plan","desc":"Establish incident response plans for third-party GAI technologies: Align incident response plans with impacts enumerated in MAP 5.1; Communicate third-party GAI incident response plans to all relevant AI Actors; Define ownership of GAI incident response functions; Rehearse third-party GAI incident response plans at a regular cadence; Improve incident response plans based on retrospective learning; Review incident response plans for alignment with relevant breach reporting, data protection, data privacy, or other laws.","type":"Corrective","assetType":"Processes/Environment/Tools","cost":null},{"id":"C37","name":"Role Clarity","desc":"Conduct joint educational activities and events in collaboration with third parties to promote best practices for managing GAI risks.","type":"Preventive","assetType":"Actors/Stakeholders","cost":null},{"id":"C38","name":"AI Awareness Training","desc":"Allocate time and resources for outreach, feedback, and recourse processes in GAI system development.","type":"Corrective","assetType":"Environment/Tools","cost":null},{"id":"C39","name":"AI Training Programs","desc":"Include relevant AI Actors in the GAI system risk identification process.","type":"Preventive/Corrective","assetType":"Processes","cost":null},{"id":"C40","name":"Oversight Mechanisms","desc":"Consider adjustment of organizational roles and components across lifecycle stages of large or complex GAI systems, including: Test and evaluation, validation, and red-teaming of GAI systems; GAI content moderation; GAI system development and engineering; Increased accessibility of GAI tools, interfaces, and systems, Incident response and containment.","type":"Corrective","assetType":"Artefacts, Environment/Tools","cost":null},{"id":"C41","name":"Privacy Compliance","desc":"Align GAI development and use with applicable laws and regulations, including those related to data privacy, copyright and intellectual property law.","type":"Preventive","assetType":"Data","cost":null},{"id":"C42","name":"Regulatory Alignment","desc":"Consider the following factors when updating or defining risk tiers for GAI: Abuses and impacts to information integrity; Dependencies between GAI and other IT or data systems; Harm to fundamental rights or public safety; Presentation of obscene, objectionable, offensive, discriminatory, invalid or untruthful output; Psychological impacts to humans (e.g., anthropomorphization, algorithmic aversion, emotional entanglement); Possibility for malicious use; Whether the system introduces significant new security vulnerabilities; Anticipated system impact on some groups compared to others; Unreliable decision making capabilities, validity, adaptability, and variability of GAI system performance over time.","type":"Preventive","assetType":"Data, Models, Processes, Actors/Stakeholders","cost":null},{"id":"C43","name":"IP Protection","desc":"Establish terms of use and terms of service for GAI systems.","type":"Preventive","assetType":"Models","cost":null},{"id":"C44","name":"Vendor Due Diligence","desc":"Update and integrate due diligence processes for GAI acquisition and procurement vendor assessments to include intellectual property, data privacy, security, and other risks. For example, update processes to: Address solutions that may rely on embedded GAI technologies; Address ongoing monitoring, assessments, and alerting, dynamic risk assessments, and real-time reporting tools for monitoring third-party GAI risks; Consider policy adjustments across GAI modeling libraries, tools and APIs, fine-tuned models, and embedded tools; Assess GAI vendors, open-source or proprietary GAI tools, or GAI     : `<button class="btn" data-act="reset">Reset to workbook data</button>`;
}
function revealActiveStep() { const n = document.getElementById("nav"), b = n.querySelector("[aria-current]"); if (b && n.scrollWidth > n.clientWidth) n.scrollLeft = b.offsetLeft - 16; }
function renderKpis() {
  const t = totals(), n = S.risks.length;
  const pct = t.initial ? Math.round((1 - t.final / t.initial) * 100) : 0;
  const used = S.budget ? Math.min(100, t.cost / S.budget * 100) : 0;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><span class="eyebrow">Risks in register</span><span class="v">${n}</span><span class="s">${S.risks.filter(r => band(score(r)) === "Critical").length} rated critical before treatment</span></div>
    <div class="kpi"><span class="eyebrow">Total risk score</span><span class="v">${fmt(t.initial)} <small>→ ${fmt(t.final)}</small></span><span class="s">${pct}% reduction after treatment</span></div>
    <div class="kpi"><span class="eyebrow">Control spend</span><span class="v">${eur(t.cost)}</span><span class="s">of ${eur(S.budget)} budget</span><div class="meter ${t.cost > S.budget ? "over" : ""}"><i style="width:${used}%"></i></div></div>
    <div class="kpi"><span class="eyebrow">Controls selected</span><span class="v">${t.sel} <small>of ${n}</small></span><span class="s">${n - t.sel} risk${n - t.sel === 1 ? "" : "s"} accepted</span></div>`;
}
function render() {
  const a = document.activeElement, fid = a && a.id, sel = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  renderNav(); revealActiveStep(); renderKpis();
  document.getElementById("view").innerHTML = views[ui.view]();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && sel[0] != null) try { el.setSelectionRange(...sel); } catch {} } }
}
function go(v) { ui.view = v; ui.msg = null; ui.confirm = null; try { history.replaceState(null, "", "#" + v); } catch {} render(); window.scrollTo({ top: 0 }); }
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }

/* ---------- helpers ---------- */
const head = (title, text, extra = "") => `<div class="vhead"><div><h2>${title}</h2><p>${text}</p></div>${extra}</div>`;
const search = (key, ph) => `<input type="search" id="q-${key}" data-q="${key}" placeholder="${ph}" value="${esc(ui.q[key] || "")}" aria-label="${ph}">`;
const match = (key, ...fields) => { const q = (ui.q[key] || "").trim().toLowerCase(); return !q || fields.some(f => String(f).toLowerCase().includes(q)); };
const chip = (id, name, act) => `<button type="button" class="chip" ${act ? `data-act="${act}" data-id="${id}"` : ""}><span class="id">${id}</span>${esc(name)}</button>`;
const inRegister = id => S.risks.some(r => r.threat === id);
const usedAssetsOf = tid => (assetsOfThreat[tid] || []).filter(a => asset[a]?.inUse === true);
const useCounts = list => ({ yes: list.filter(a => a.inUse === true).length, no: list.filter(a => a.inUse === false).length, unset: list.filter(a => a.inUse == null).length });

/* ---------- views ---------- */
const views = {};

views.assets = () => {
  const L = DATA.legend;
  const legend = `<div class="panel pad"><div class="legend">
    <div><span class="pill p-H">H</span><span>${esc(L[1].replace(/^High \(H\):\s*/, ""))}</span></div>
    <div><span class="pill p-M">M</span><span>${esc(L[2].replace(/^Medium \(M\):\s*/, ""))}</span></div>
    <div><span class="pill p-L">L</span><span>${esc(L[3].replace(/^Low \(L\):\s*/, ""))}</span></div>
  </div><p class="muted" style="margin:10px 0 0;font-size:12px">Value is how important the asset is across the AI system's lifecycle. Risk exposure is the impact if it is compromised.</p></div>`;
  const subs = LIB.assets.filter(a => !isGroup(a.id)), u = useCounts(subs);
  const fit = a => ({ all: true, yes: a.inUse === true, no: a.inUse === false, unset: a.inUse == null })[ui.useFilter];
  let rows = "";
  for (const a of LIB.assets) {
    if (isGroup(a.id)) {
      const kids = subs.filter(x => groupOf(x.id) === a.id && fit(x) && match("assets", x.id, x.name, x.desc));
      if (kids.length) rows += `<tr class="sec"><td colspan="7">${a.id} · ${esc(a.name)} <span class="muted" style="font-weight:400">· ${useCounts(subs.filter(x => groupOf(x.id) === a.id)).yes} in use</span></td></tr>`;
      continue;
    }
    if (!fit(a) || !match("assets", a.id, a.name, a.desc)) continue;
    const ts = (threatsOfAsset[a.id] || []).sort(idSort), open = ui.open.has(a.id), v = a.inUse === true ? "yes" : a.inUse === false ? "no" : "";
    rows += `<tr class="click" tabindex="0" data-act="toggle" data-id="${a.id}" aria-expanded="${open}"><td class="id">${a.id}</td><td><strong>${esc(a.name)}</strong></td><td class="desc">${esc(a.desc)}</td>
      <td><select class="use use-${v || "unset"}" id="use-${a.id}" data-use="${a.id}" aria-label="Is ${esc(a.name)} used in your organisation?"><option value="" ${v ? "" : "selected"}>Not answered</option><option value="yes" ${v === "yes" ? "selected" : ""}>Yes</option><option value="no" ${v === "no" ? "selected" : ""}>No</option></select></td>
      <td><span class="pill p-${a.value}">${a.value}</span></td><td><span class="pill p-${a.exposure}">${a.exposure}</span></td><td class="num">${ts.length}</td></tr>`;
    if (open) rows += `<tr class="detail"><td></td><td colspan="6"><div class="eyebrow" style="margin-bottom:6px">Threats affecting this asset</div>${ts.length ? `<div class="chips">${ts.map(t => chip(t, threat[t].name, "goto-threat")).join("")}</div>` : `<span class="muted">No threats mapped in the workbook.</span>`}</td></tr>`;
  }
  const f = (id, label, n) => `<button type="button" class="chip ${ui.useFilter === id ? "on" : ""}" data-act="use-filter" data-id="${id}">${label} <span class="id">${n}</span></button>`;
  return head("Assets", `${subs.length} assets across ${LIB.assets.filter(a => isGroup(a.id)).length} groups. Mark which ones your organisation uses, here or with the assets template on the Import CSV page.`, `<div class="toolbar">${search("assets", "Search assets")}</div>`)
    + legend
    + `<div class="chips" role="group" aria-label="Filter by use">${f("all", "All", subs.length)}${f("yes", "In use", u.yes)}${f("no", "Not used", u.no)}${f("unset", "Not answered", u.unset)}</div>`
    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Asset</th><th>Description</th><th>In use</th><th>Value</th><th>Exposure</th><th class="num">Threats</th></tr></thead><tbody>${rows || `<tr><td colspan="7" class="muted">No assets match this filter.</td></tr>`}</tbody></table></div>`;
};

views.threats = () => {
  const answered = LIB.assets.some(a => a.inUse === true);
  const relevant = id => !ui.relevant || !answered || usedAssetsOf(id).length > 0;
  let rows = "";
  for (const t of LIB.threats) {
    if (!match("threats", t.id, t.name, t.desc)) continue;
    if (isGroup(t.id)) { if (LIB.threats.some(x => groupOf(x.id) === t.id && !isGroup(x.id) && relevant(x.id) && match("threats", x.id, x.name, x.desc))) rows += `<tr class="sec"><td colspan="6">${t.id} · ${esc(t.name)}</td></tr>`; continue; }
    if (!relevant(t.id)) continue;
    const as = (assetsOfThreat[t.id] || []).sort(idSort), cs = (controlsOfThreat[t.id] || []).sort(idSort), open = ui.open.has(t.id);
    rows += `<tr class="click" tabindex="0" data-act="toggle" data-id="${t.id}" aria-expanded="${open}"><td class="id">${t.id}</td><td><strong>${esc(t.name)}</strong>${inRegister(t.id) ? ` <span class="pill strat-Mitigate">In register</span>` : ""}</td><td class="desc">${esc(t.desc)}</td>
      <td class="num">${answered ? `${usedAssetsOf(t.id).length} <span class="muted">of ${as.length}</span>` : as.length}</td><td class="num">${cs.length}</td><td>${inRegister(t.id) ? "" : `<button class="btn small" data-act="add-risk" data-id="${t.id}">Add to register</button>`}</td></tr>`;
    if (open) rows += `<tr class="detail"><td></td><td colspan="5"><div style="display:grid;gap:12px">
      <div><div class="eyebrow" style="margin-bottom:6px">Affected assets</div>${as.length ? `<div class="chips">${as.map(a => chip(a, asset[a].name + (asset[a].inUse === true ? " · in use" : ""), "goto-asset")).join("")}</div>` : `<span class="muted">None mapped.</span>`}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Mitigating controls</div>${cs.length ? `<div class="chips">${cs.map(c => chip(c, control[c].name, "goto-control")).join("")}</div>` : `<span class="muted">None mapped.</span>`}</div></div></td></tr>`;
  }
  return head("Threats", `${LIB.threats.filter(t => !isGroup(t.id)).length} AI threats in ${LIB.threats.filter(t => isGroup(t.id)).length} groups. Select a row to see affected assets and the controls that mitigate it.${answered ? " The Assets column counts assets your organisation uses." : ""}`,
      `<div class="toolbar">${answered ? `<label class="inline" for="relevant"><input type="checkbox" id="relevant" data-ui="relevant" ${ui.relevant ? "checked" : ""}>Only threats to assets in use</label>` : ""}${search("threats", "Search threats")}</div>`)
    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Threat</th><th>Description</th><th class="num">Assets</th><th class="num">Controls</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">No threats match your search.</td></tr>`}</tbody></table></div>`;
};

views.controls = () => {
  let rows = "";
  for (const c of DATA.controls) {
    if (!match("controls", c.id, c.name, c.desc, c.type, c.assetType)) continue;
    const ts = (threatsOfControl[c.id] || []).sort(idSort), open = ui.open.has(c.id);
    rows += `<tr class="click" tabindex="0" data-act="toggle" data-id="${c.id}" aria-expanded="${open}"><td class="id">${c.id}</td><td><strong>${esc(c.name)}</strong></td><td class="desc">${esc(c.desc)}</td>
      <td>${esc(c.type)}</td><td>${esc(c.assetType)}</td><td class="num">${ts.length}</td></tr>`;
    if (open) rows += `<tr class="detail"><td></td><td colspan="5"><div class="eyebrow" style="margin-bottom:6px">Threats this control mitigates</div>${ts.length ? `<div class="chips">${ts.map(t => chip(t, threat[t].name, "goto-threat")).join("")}</div>` : `<span class="muted">None mapped.</span>`}</td></tr>`;
  }
  return head("Controls", `${DATA.controls.length} security controls, mostly based on MITRE ATLAS mitigations. Select a row to see the threats it covers.`, `<div class="toolbar">${search("controls", "Search controls")}</div>`)
    + `<div class="panel scroll"><table><thead><tr><th>ID</th><th>Control</th><th>Description</th><th>Type</th><th>Asset type</th><th class="num">Threats</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">No controls match your search.</td></tr>`}</tbody></table></div>`;
};

views.mappings = () => {
  const groups = LIB.threats.filter(t => isGroup(t.id));
  if (!groups.some(g => g.id === ui.mxGroup)) ui.mxGroup = groups[0]?.id;
  const subs = LIB.threats.filter(t => groupOf(t.id) === ui.mxGroup && !isGroup(t.id));
  const has = new Set((ui.mx === "at" ? LIB.assetThreat : LIB.threatControl).map(p => p.join("|")));
  let table, key;
  if (ui.mx === "at") {
    let body = "";
    for (const a of LIB.assets) {
      if (isGroup(a.id)) { body += `<tr class="sec"><td colspan="${subs.length + 1}">${a.id} · ${esc(a.name)}</td></tr>`; continue; }
      body += `<tr><td title="${esc(a.name)}"><span class="id">${a.id}</span> ${esc(a.name)}</td>${subs.map(t => `<td class="${has.has(a.id + "|" + t.id) ? "dot" : ""}" title="${esc(a.name)} × ${esc(t.name)}"></td>`).join("")}</tr>`;
    }
    table = `<table class="mx"><thead><tr><th>Asset \\ Threat</th>${subs.map(t => `<th title="${esc(t.name)}">${t.id}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
    key = subs.map(t => `<div><span class="id">${t.id}</span> ${esc(t.name)}</div>`).join("");
  } else {
    const cols = DATA.controls.filter(c => subs.some(t => has.has(t.id + "|" + c.id)));
    const body = subs.map(t => `<tr><td title="${esc(t.name)}"><span class="id">${t.id}</span> ${esc(t.name)}</td>${cols.map(c => `<td class="${has.has(t.id + "|" + c.id) ? "dot" : ""}" title="${esc(t.name)} × ${esc(c.name)}"></td>`).join("")}</tr>`).join("");
    table = cols.length ? `<table class="mx"><thead><tr><th>Threat \\ Control</th>${cols.map(c => `<th title="${esc(c.name)}">${c.id}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>` : `<p class="muted pad">No controls mapped to this group.</p>`;
    key = cols.map(c => `<div><span class="id">${c.id}</span> ${esc(c.name)}</div>`).join("");
  }
  return head("Mappings", "The workbook's two relationship matrices. A dot means the pair is linked. Pick a threat group to keep the grid readable.")
    + `<div class="toolbar"><div class="chips" role="group" aria-label="Matrix">
        <button type="button" class="chip ${ui.mx === "at" ? "on" : ""}" data-act="mx" data-id="at">Assets × Threats</button>
        <button type="button" class="chip ${ui.mx === "tc" ? "on" : ""}" data-act="mx" data-id="tc">Threats × Controls</button></div></div>
      <div class="chips" role="group" aria-label="Threat group">${groups.map(g => `<button type="button" class="chip ${ui.mxGroup === g.id ? "on" : ""}" data-act="mxg" data-id="${g.id}"><span class="id">${g.id}</span>${esc(g.name)}</button>`).join("")}</div>
      <div class="panel scroll">${table}</div>
      <div class="panel pad"><div class="eyebrow" style="margin-bottom:8px">Key</div><div class="key">${key}</div></div>`;
};

const riskRef = r => `<span class="id">${r.threat}</span> <strong>${esc(r.name)}</strong>`;
const emptyRegister = `<div class="panel pad muted">The register is empty. Add risks in step 1, Identify.</div>`;

views.identify = () => {
  const avail = LIB.threats.filter(t => !isGroup(t.id) && !inRegister(t.id));
  const groups = LIB.threats.filter(t => isGroup(t.id));
  const opts = groups.map(g => `<optgroup label="${g.id} ${esc(g.name)}">${avail.filter(t => groupOf(t.id) === g.id).map(t => `<option value="${t.id}">${t.id} ${esc(t.name)}</option>`).join("")}</optgroup>`).join("");
  const rows = S.risks.map((r, k) => `<tr>
    <td class="id">${r.threat}</td>
    <td><input class="wide" id="name-${k}" data-k="${k}" data-f="name" value="${esc(r.name)}" aria-label="Risk name"><div class="ctrl-desc">Pool entry: ${esc(threat[r.threat]?.name || "")}</div></td>
    <td><input class="wide" id="assets-${k}" data-k="${k}" data-f="assets" value="${esc(r.assets)}" aria-label="Associated assets"></td>
    <td><input class="wide" id="owner-${k}" data-k="${k}" data-f="owner" value="${esc(r.owner)}" placeholder="Assign an owner" aria-label="Risk owner"></td>
    <td>${ui.confirm === k ? `<span class="confirm"><button class="btn small danger" data-act="del-yes" data-k="${k}">Remove</button><button class="btn small" data-act="del-no">Keep</button></span>` : `<button class="btn small" data-act="del" data-k="${k}">Remove</button>`}</td></tr>`).join("");
  return head("1 · Identify risks", "Choose which threats from the pool apply to this AI system, which assets they touch, and who owns each risk.")
    + `<div class="panel pad toolbar"><label class="inline" for="add-sel">Add a threat</label><select id="add-sel" style="max-width:100%;min-width:0;flex:1 1 280px">${opts}</select><button class="btn primary" data-act="add-from-select">Add to register</button></div>`
    + (S.risks.length ? `<div class="panel scroll"><table><thead><tr><th>Threat ID</th><th>Risk</th><th>Associated assets</th><th>Risk owner</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyRegister);
};

views.assess = () => {
  if (!S.risks.length) return head("2 · Assess risks", "") + emptyRegister;
  const rows = S.risks.map((r, k) => { const s = score(r), b = band(s); return `<tr>
    <td>${riskRef(r)}</td>
    <td><input type="number" id="l-${k}" data-k="${k}" data-f="l" min="1" max="5" step="0.5" value="${r.l}" aria-label="Likelihood"></td>
    <td><input type="number" id="i-${k}" data-k="${k}" data-f="i" min="1" max="5" step="0.5" value="${r.i}" aria-label="Impact"></td>
    <td class="num"><strong>${fmt(s)}</strong></td><td><span class="pill b-${b}">${b}</span></td></tr>`; }).join("");
  const total = S.risks.reduce((a, r) => a + score(r), 0);
  let grid = "";
  for (let i = 5; i >= 1; i--) {
    grid += `<div class="ax">${i}</div>`;
    for (let l = 1; l <= 5; l++) {
      const tags = S.risks.filter(r => Math.min(5, Math.max(1, Math.round(r.i))) === i && Math.min(5, Math.max(1, Math.round(r.l))) === l);
      grid += `<div class="c b-${band(l * i)}" title="Likelihood ${l} × Impact ${i} = ${l * i}">${tags.map(r => `<span class="tag" title="${esc(r.name)}">${r.threat}</span>`).join("")}</div>`;
    }
  }
  grid += `<div></div>${[1, 2, 3, 4, 5].map(l => `<div class="ax">${l}</div>`).join("")}`;
  return head("2 · Assess risks", "Rate the likelihood and impact of each risk from 1 to 5. Risk score is likelihood × impact.")
    + `<div class="assess"><div class="panel scroll"><table><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th class="num">Score</th><th>Rating</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${fmt(total)}</td><td></td></tr></tfoot></table></div>
      <div class="panel pad"><h3 style="margin-bottom:10px">Risk heat map</h3><div class="heat" role="img" aria-label="Risks plotted by likelihood and impact">${grid}</div>
      <div class="heat-cap"><span>↑ Impact</span><span>Likelihood →</span></div>
      <div class="legend" style="margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px">
        <div><span class="pill b-Critical">Critical</span><span class="muted">12 and above</span></div><div><span class="pill b-High">High</span><span class="muted">8 to under 12</span></div>
        <div><span class="pill b-Limited">Limited</span><span class="muted">4 to under 8</span></div><div><span class="pill b-Low">Low</span><span class="muted">under 4</span></div></div></div></div>`;
};

views.evaluate = () => {
  if (!S.risks.length) return head("3 · Evaluate controls", "") + emptyRegister;
  const rows = S.risks.map((r, k) => {
    const mapped = (controlsOfThreat[r.threat] || []).sort(idSort);
    const other = DATA.controls.map(c => c.id).filter(c => !mapped.includes(c));
    const o = id => `<option value="${id}" ${r.control === id ? "selected" : ""}>${id} ${esc(control[id].name)}</option>`;
    return `<tr><td>${riskRef(r)}</td>
      <td><select class="wide" id="ctl-${k}" data-k="${k}" data-f="control" aria-label="Control"><option value="">Choose a control</option>
        ${mapped.length ? `<optgroup label="Mapped to this threat">${mapped.map(o).join("")}</optgroup>` : ""}<optgroup label="All other controls">${other.map(o).join("")}</optgroup></select>
        ${r.control ? `<div class="ctrl-desc">${esc(control[r.control]?.desc || "")}${mapped.includes(r.control) || !r.control ? "" : " <strong>Not mapped to this threat in the workbook.</strong>"}</div>` : ""}</td>
      <td><textarea id="why-${k}" data-k="${k}" data-f="why" aria-label="Why this control helps">${esc(r.why)}</textarea></td>
      <td><input type="number" id="eff-${k}" data-k="${k}" data-f="eff" min="0" max="10" step="1" value="${r.eff}" aria-label="Effectiveness"></td></tr>`;
  }).join("");
  return head("3 · Evaluate controls", "Pick the control that treats each risk and rate how effective it is, from 0 (no effect) to 10 (removes the risk). Controls mapped to the threat are listed first.")
    + `<div class="panel scroll"><table><thead><tr><th>Risk</th><th>Control</th><th>Explanation</th><th>Effectiveness</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};

function optimise() {
  const rs = S.risks, n = rs.length;
  const val = r => S.objective === "eff" ? r.eff : score(r) * r.eff / 10;
  let best = { v: -1, c: Infinity, m: 0 };
  if (n <= 20) {
    for (let m = 0; m < (1 << n); m++) {
      let c = 0, v = 0;
      for (let j = 0; j < n; j++) if (m >> j & 1) { c += rs[j].cost; v += val(rs[j]); }
      if (c <= S.budget && (v > best.v + 1e-9 || (Math.abs(v - best.v) < 1e-9 && c < best.c))) best = { v, c, m };
    }
    rs.forEach((r, j) => r.sel = !!(best.m >> j & 1));
  } else {
    let c = 0;
    rs.forEach(r => r.sel = false);
    [...rs].sort((a, b) => val(b) / (b.cost || 1) - val(a) / (a.cost || 1)).forEach(r => { if (c + r.cost <= S.budget) { r.sel = true; c += r.cost; } });
  }
  const t = totals();
  ui.msg = { ok: true, text: `Selected ${t.sel} of ${n} controls for ${eur(t.cost)}, within the ${eur(S.budget)} budget. Total risk drops from ${fmt(t.initial)} to ${fmt(t.final)}.` };
}

views.treat = () => {
  if (!S.risks.length) return head("4 · Treat risks", "") + emptyRegister;
  const t = totals();
  const rows = S.risks.map((r, k) => { const s = score(r), f = finalScore(r); return `<tr>
    <td>${riskRef(r)}</td>
    <td>${r.control ? `<span class="id">${r.control}</span> ${esc(control[r.control]?.name || "")}` : `<span class="muted">No control chosen</span>`}</td>
    <td><input type="number" id="cost-${k}" data-k="${k}" data-f="cost" min="0" step="500" value="${r.cost}" style="width:96px" aria-label="Cost in euros"></td>
    <td class="num">${fmt(s)}</td><td class="num">${r.eff}</td><td class="num">${fmt(residual(r))}</td>

          <button type="button" class="chip ${ui.impMode === "replace" ? "on" : ""}" data-act="imp-mode" data-id="replace">Replace the whole list</button></div>
        <p class="muted" style="margin:0;font-size:13px">${ui.impMode === "merge" ? "Rows with a new ID are added. Rows with an existing ID overwrite it. Everything else stays." : "The uploaded file becomes the complete list. Anything not in the file is removed."}</p>
        <label class="drop" for="imp-file"><span><strong>Choose a CSV file</strong> or drop it here. The app detects assets or threats from the header row.</span><span class="btn">Browse…</span></label>
        <input type="file" id="imp-file" accept=".csv,.txt,text/csv" hidden>
        <details><summary>Or paste rows from Excel</summary>
          <textarea class="code" id="imp-paste" style="margin-top:8px" placeholder="Paste rows here, including the header row" aria-label="Pasted rows">${esc(ui.paste)}</textarea>
          <button class="btn" data-act="imp-check-paste" style="margin-top:8px">Check pasted rows</button></details></div>`
    + preview
    + (ui.impDone ? `<div class="note ok">${esc(ui.impDone)}</div>` : "")
    + `<p class="muted" style="margin:0;font-size:12px">Imports are saved in this browser only. "Reset to workbook data" at the top undoes them.</p>`;
};

/* ---------- events ---------- */
function addRisk(id, quiet) {
  if (!id || inRegister(id)) return;
  const groups = [...new Set((assetsOfThreat[id] || []).map(a => asset[groupOf(a)]?.name).filter(Boolean))];
  const mapped = (controlsOfThreat[id] || []).sort(idSort);
  const r = { threat: id, name: threat[id].name, assets: groups.join(", "), owner: "", l: 3, i: 3, control: mapped[0] || "", eff: 5, why: "", cost: 0, sel: false };
  S.risks.push(r);
  save(); if (!quiet) toast(`Added ${id} to the register`);
  return r;
}

document.addEventListener("click", e => {
  if (e.target.matches("select, option, input, textarea")) return;
  const nav = e.target.closest("[data-view]"); if (nav) return go(nav.dataset.view);
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, k = +b.dataset.k;
  switch (b.dataset.act) {
    case "toggle": ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); break;
    case "goto-threat": e.stopPropagation(); ui.q.threats = id; ui.open.add(id); return go("threats");
    case "goto-asset": e.stopPropagation(); ui.q.assets = id; ui.open.add(id); return go("assets");
    case "goto-control": e.stopPropagation(); ui.q.controls = id; ui.open.add(id); return go("controls");
    case "add-risk": e.stopPropagation(); addRisk(id); break;
    case "add-from-select": addRisk(document.getElementById("add-sel")?.value); break;
    case "del": ui.confirm = k; break;
    case "del-no": ui.confirm = null; break;
    case "del-yes": S.risks.splice(k, 1); ui.confirm = null; save(); break;
    case "mx": ui.mx = id; break;
    case "mxg": ui.mxGroup = id; break;
    case "optimise": optimise(); save(); break;
    case "reset": ui.resetting = true; break;
    case "reset-no": ui.resetting = false; break;
    case "reset-yes": LIB = workbookLib(); reindex(); saveLib(); S = seed(); ui.resetting = false; ui.msg = null; ui.imp = null; ui.impDone = null; save(); toast("Workbook data restored"); break;
    case "tpl": ui.tpl = id; break;
    case "tpl-src": ui.tplSrc = id; break;
    case "use-filter": ui.useFilter = id; break;
    case "dl-json": downloadFile(`risk-treatment-${new Date().toISOString().slice(0, 10)}.json`, treatmentJson(), "application/json"); return;
    case "dl": downloadCsv(dlName(id, b.dataset.src), templateCsv(id, b.dataset.src)); return;
    case "tpl-copy": {
      const ta = document.getElementById("tpl-text");
      navigator.clipboard?.writeText(ta.value).then(() => toast("Template copied. Paste it into Excel or a text editor."), () => { ta.focus(); ta.select(); toast("Press Ctrl+C to copy the selected text."); });
      return;
    }
    case "imp-mode": ui.impMode = id; break;
    case "imp-check-paste": ui.imp = checkCsv(ui.paste, "Pasted rows"); ui.impDone = null; break;
    case "imp-cancel": ui.imp = null; break;
    case "imp-apply": ui.impDone = applyImport(ui.imp, ui.impMode); ui.imp = null; ui.paste = ""; toast("Import complete"); break;
    case "copy": {
      const hdr = ["Threat ID", "Threat", "Control ID", "Control", "Cost (€)", "Initial risk", "Effectiveness", "Residual risk", "Selected", "Final risk", "Strategy"];
      const lines = [hdr, ...S.risks.map(r => [r.threat, r.name, r.control, control[r.control]?.name || "", r.cost, fmt(score(r)), r.eff, fmt(residual(r)), r.sel ? 1 : 0, fmt(finalScore(r)), r.sel ? "Mitigate" : "Accept"])].map(x => x.join("\t")).join("\n");
      navigator.clipboard?.writeText(lines).then(() => toast("Table copied. Paste it into Excel."), () => toast("Copy was blocked by the browser."));
      return;
    }
  }
  render();
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.click")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "imp-paste") { ui.paste = e.target.value; return; }
  const q = e.target.dataset.q; if (q != null) { ui.q[q] = e.target.value; render(); }
});
function readFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => { ui.imp = checkCsv(String(fr.result), file.name); ui.impDone = null; render(); };
  fr.onerror = () => { ui.imp = { error: `Could not read ${file.name}. Save it as "CSV UTF-8" and try again.` }; render(); };
  fr.readAsText(file, "UTF-8");
}
document.addEventListener("dragover", e => { const z = e.target.closest?.(".drop"); if (z) { e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", e => { e.target.closest?.(".drop")?.classList.remove("over"); });
document.addEventListener("drop", e => { const z = e.target.closest?.(".drop"); if (z) { e.preventDefault(); readFile(e.dataTransfer.files[0]); } });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "imp-file") { readFile(el.files[0]); el.value = ""; return; }
  if (el.dataset.use) {
    const a = LIB.assets.find(x => x.id === el.dataset.use);
    if (a) { a.inUse = el.value === "yes" ? true : el.value === "no" ? false : undefined; saveLib(); reindex(); }
    return render();
  }
  if (el.dataset.ui) { ui[el.dataset.ui] = el.checked; return render(); }
  if (el.dataset.g) { S[el.dataset.g] = el.type === "number" ? Math.max(0, +el.value || 0) : el.value; ui.msg = null; save(); return render(); }
  if (el.dataset.f == null) return;
  const r = S.risks[+el.dataset.k], f = el.dataset.f;
  if (!r) return;
  if (f === "sel") { r.sel = el.checked; ui.msg = null; }
  else if (el.type === "number") {
    const lim = { l: [1, 5], i: [1, 5], eff: [0, 10], cost: [0, Infinity] }[f];
    r[f] = Math.min(lim[1], Math.max(lim[0], +el.value || 0));
  } else r[f] = el.value;
  save(); render();
});

const h = location.hash.slice(1);
if (VIEWS.some(v => v.id === h)) ui.view = h;
render();
</script>
